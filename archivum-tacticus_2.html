<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Archivum Tacticus — Wrath &amp; Glory</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=Share+Tech+Mono&display=swap');

:root {
  --bg-deep: #0f0d0a;
  --bg-panel: #1b1611;
  --bg-panel-raised: #241d16;
  --bone: #ddd0ad;
  --bone-dim: #9c8f72;
  --blood: #7f1d1d;
  --blood-bright: #a83232;
  --brass: #b6893f;
  --brass-dim: #6f5527;
  --border: #3a2f22;
  --font-display: 'Cinzel', serif;
  --font-body: 'EB Garamond', serif;
  --font-mono: 'Share Tech Mono', monospace;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(ellipse at top, #211a13 0%, var(--bg-deep) 55%),
    var(--bg-deep);
  color: var(--bone);
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.5;
}

::selection { background: var(--blood); color: var(--bone); }

a { color: var(--brass); }

/* ---------- Header ---------- */

.site-header {
  border-bottom: 1px solid var(--border);
  padding: 1.4rem 1.5rem 1rem;
  text-align: center;
  position: relative;
  background: linear-gradient(180deg, rgba(0,0,0,0.25), transparent);
}

.site-header .aquila {
  font-size: 1.4rem;
  color: var(--brass);
  letter-spacing: 0.5rem;
}

.site-title {
  font-family: var(--font-display);
  font-weight: 900;
  letter-spacing: 0.12em;
  font-size: 1.7rem;
  margin: 0.3rem 0 0.15rem;
  color: var(--bone);
  text-shadow: 0 0 18px rgba(166,124,61,0.25);
}

.site-subtitle {
  font-family: var(--font-mono);
  font-size: 0.72rem;
  letter-spacing: 0.18em;
  color: var(--brass-dim);
  text-transform: uppercase;
}

/* ---------- Nav ---------- */

.tabs {
  display: flex;
  justify-content: center;
  gap: 0.5rem;
  padding: 0.9rem 1rem;
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
}

.tab-btn {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--bone-dim);
  font-family: var(--font-display);
  font-size: 0.78rem;
  letter-spacing: 0.08em;
  padding: 0.5rem 1.1rem;
  cursor: pointer;
  border-radius: 2px;
  transition: all 0.15s ease;
}

.tab-btn:hover { color: var(--bone); border-color: var(--brass-dim); }

.tab-btn.active {
  color: var(--bg-deep);
  background: var(--brass);
  border-color: var(--brass);
}

/* ---------- Layout ---------- */

main {
  max-width: 920px;
  margin: 0 auto;
  padding: 1.5rem 1rem 4rem;
}

.view { display: none; }
.view.active { display: block; }

.panel {
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 1.2rem;
  margin-bottom: 1.2rem;
}

h2.section-title {
  font-family: var(--font-display);
  font-size: 1.05rem;
  letter-spacing: 0.06em;
  color: var(--brass);
  margin: 0 0 0.8rem;
  padding-bottom: 0.5rem;
  border-bottom: 1px solid var(--border);
}

/* ---------- Buttons ---------- */

.btn {
  font-family: var(--font-display);
  font-size: 0.75rem;
  letter-spacing: 0.05em;
  background: var(--bg-panel-raised);
  border: 1px solid var(--border);
  color: var(--bone);
  padding: 0.55rem 1rem;
  border-radius: 3px;
  cursor: pointer;
}

.btn:hover { border-color: var(--brass-dim); }

.btn-primary {
  background: var(--blood);
  border-color: var(--blood-bright);
  color: var(--bone);
}
.btn-primary:hover { background: var(--blood-bright); }

.btn-danger {
  border-color: var(--blood);
  color: var(--blood-bright);
  background: transparent;
}
.btn-danger:hover { background: var(--blood); color: var(--bone); }

.btn-row { display: flex; gap: 0.6rem; flex-wrap: wrap; margin-top: 1rem; }

/* ---------- Character list ---------- */

.char-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 0.8rem;
}

.char-card {
  background: var(--bg-panel-raised);
  border: 1px solid var(--border);
  border-left: 3px solid var(--brass-dim);
  border-radius: 3px;
  padding: 0.9rem 1rem;
  cursor: pointer;
  transition: border-color 0.15s ease;
}
.char-card:hover { border-left-color: var(--brass); }

.char-card .cname {
  font-family: var(--font-display);
  font-size: 1rem;
  color: var(--bone);
}
.char-card .cmeta {
  font-family: var(--font-mono);
  font-size: 0.72rem;
  color: var(--bone-dim);
  margin-top: 0.25rem;
  letter-spacing: 0.03em;
}

.empty-state {
  text-align: center;
  color: var(--bone-dim);
  font-style: italic;
  padding: 2rem 1rem;
}

/* ---------- Forms ---------- */

label {
  display: block;
  font-family: var(--font-mono);
  font-size: 0.68rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--brass-dim);
  margin-bottom: 0.25rem;
}

input[type="text"], input[type="number"], select, textarea {
  width: 100%;
  background: var(--bg-deep);
  border: 1px solid var(--border);
  color: var(--bone);
  font-family: var(--font-body);
  font-size: 1rem;
  padding: 0.5rem 0.6rem;
  border-radius: 3px;
}

input:focus, select:focus, textarea:focus {
  outline: none;
  border-color: var(--brass);
}

.field { margin-bottom: 0.9rem; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem; }

/* ---------- Attribute / Skill grids ---------- */

.stat-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 0.6rem;
}

.stat-box {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--bg-deep);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 0.45rem 0.6rem;
}

.stat-box .stat-name {
  font-size: 0.85rem;
  color: var(--bone-dim);
}
.stat-box .stat-name small { display:block; font-family: var(--font-mono); font-size: 0.65rem; color: var(--brass-dim); }

.stat-box input[type="number"] {
  width: 3.4rem;
  text-align: center;
  font-family: var(--font-mono);
  color: var(--bone);
  padding: 0.3rem;
}

.xp-summary {
  font-family: var(--font-mono);
  font-size: 0.8rem;
  color: var(--brass);
  text-align: right;
  margin-top: 0.6rem;
}

/* ---------- Codex ---------- */

.subtabs { display: flex; gap: 0.4rem; margin-bottom: 1rem; flex-wrap: wrap; }
.subtab-btn {
  font-family: var(--font-mono);
  font-size: 0.68rem;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  background: transparent;
  border: 1px solid var(--border);
  color: var(--bone-dim);
  padding: 0.4rem 0.7rem;
  cursor: pointer;
  border-radius: 3px;
}
.subtab-btn.active { color: var(--bg-deep); background: var(--brass-dim); border-color: var(--brass-dim); }

.codex-entry {
  border-bottom: 1px solid var(--border);
  padding: 0.7rem 0;
}
.codex-entry:last-child { border-bottom: none; }
.codex-entry .entry-name {
  font-family: var(--font-display);
  font-size: 0.95rem;
  color: var(--bone);
}
.codex-entry .entry-tag {
  font-family: var(--font-mono);
  font-size: 0.65rem;
  color: var(--brass);
  margin-left: 0.5rem;
}
.codex-entry .entry-desc {
  font-size: 0.92rem;
  color: var(--bone-dim);
  margin-top: 0.2rem;
}

table.codex-table {
  width: 100%;
  border-collapse: collapse;
  font-family: var(--font-mono);
  font-size: 0.78rem;
}
table.codex-table th, table.codex-table td {
  border: 1px solid var(--border);
  padding: 0.35rem 0.5rem;
  text-align: center;
}
table.codex-table th { color: var(--brass); background: var(--bg-panel-raised); }

.list-tag-input { display: flex; gap: 0.5rem; margin-bottom: 0.5rem; }
.tag-chip {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  background: var(--bg-panel-raised);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 0.3rem 0.6rem;
  margin: 0.2rem 0.3rem 0.2rem 0;
  font-size: 0.85rem;
}
.tag-chip button {
  background: none; border: none; color: var(--blood-bright); cursor: pointer; font-weight: bold;
}

.note {
  font-size: 0.82rem;
  color: var(--bone-dim);
  font-style: italic;
  margin-top: 0.5rem;
}

@media (max-width: 480px) {
  .stat-grid { grid-template-columns: 1fr; }
  .field-row { grid-template-columns: 1fr; }
}

/* ============ Ajouts : portrait, stats dérivées, tableaux fiche ============ */

.char-card { display: flex; align-items: center; gap: 0.8rem; }
.char-thumb { width: 48px; height: 48px; border-radius: 3px; object-fit: cover; border: 1px solid var(--border); flex-shrink: 0; }
.char-thumb-empty { display: flex; align-items: center; justify-content: center; color: var(--brass-dim); font-size: 1.2rem; background: var(--bg-deep); }
.char-card-info { flex: 1; }

.portrait-row { display: flex; gap: 1rem; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; }
.portrait-preview { width: 90px; height: 90px; border-radius: 4px; border: 1px solid var(--border); background: var(--bg-deep); display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0; }
.portrait-preview img { width: 100%; height: 100%; object-fit: cover; }
.portrait-preview span { font-size: 1.8rem; color: var(--brass-dim); }
.portrait-controls { flex: 1; min-width: 200px; }
.portrait-controls input[type="file"] { font-size: 0.8rem; color: var(--bone-dim); margin-bottom: 0.4rem; }

.field-row-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.7rem; margin-bottom: 0.9rem; }
@media (max-width: 600px) { .field-row-4 { grid-template-columns: 1fr 1fr; } }

.stat-box { flex-wrap: wrap; }
.stat-total { font-family: var(--font-mono); font-size: 0.68rem; color: var(--brass); width: 100%; text-align: right; margin-top: 0.2rem; }

.derived-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.6rem; }
@media (max-width: 600px) { .derived-grid { grid-template-columns: repeat(2, 1fr); } }
.derived-box { background: var(--bg-deep); border: 1px solid var(--border); border-radius: 3px; padding: 0.5rem 0.6rem; text-align: center; }
.derived-box span { display: block; font-family: var(--font-mono); font-size: 0.65rem; color: var(--brass-dim); text-transform: uppercase; }
.derived-box strong { display: block; font-size: 1.3rem; color: var(--bone); font-family: var(--font-mono); }
.derived-box small { display: block; font-size: 0.62rem; color: var(--bone-dim); }

.talent-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 0.6rem; border-bottom: 1px solid var(--border); padding: 0.6rem 0; }
.talent-row:last-child { border-bottom: none; }

.sheet-equip-table input[type="text"] { background: transparent; border: 1px solid var(--border); color: var(--bone); font-size: 0.8rem; padding: 0.2rem 0.3rem; }
.sheet-equip-table td { vertical-align: top; }

.field-inline { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.4rem; }
.field-inline label { margin: 0; min-width: 1.4rem; }
.field-inline input { flex: 1; }
.graves-list { display: grid; grid-template-columns: 1fr 1fr; gap: 0 1rem; }
@media (max-width: 600px) { .graves-list { grid-template-columns: 1fr; } }

.codex-subhead { font-family: var(--font-mono); font-size: 0.75rem; color: var(--brass); margin: 1rem 0 0.5rem; }
.table-wrap { overflow-x: auto; margin-bottom: 1rem; }

/* ============ Fiche imprimable (écran) ============ */

.print-sheet { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 4px; padding: 1.5rem; }
.print-sheet h1 { font-family: var(--font-display); color: var(--bone); margin: 0 0 0.3rem; }
.print-sheet h2 { font-family: var(--font-display); font-size: 1rem; color: var(--brass); border-bottom: 1px solid var(--border); padding-bottom: 0.3rem; margin: 1.4rem 0 0.6rem; }
.print-sheet h3 { font-family: var(--font-display); font-size: 0.85rem; color: var(--bone); margin: 0 0 0.3rem; }
.pt-header { display: flex; gap: 1.2rem; align-items: flex-start; }
.pt-portrait { width: 110px; height: 110px; border: 1px solid var(--border); border-radius: 4px; overflow: hidden; flex-shrink: 0; background: var(--bg-deep); }
.pt-portrait img { width: 100%; height: 100%; object-fit: cover; }
.pt-identity div { font-size: 0.9rem; color: var(--bone-dim); margin-bottom: 0.15rem; }
.pt-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
.pt-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }
@media (max-width: 700px) { .pt-grid-2, .pt-grid-3 { grid-template-columns: 1fr; } }
.pt-table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
.pt-table th, .pt-table td { border: 1px solid var(--border); padding: 0.3rem 0.5rem; text-align: left; }
.pt-table th { background: var(--bg-panel-raised); color: var(--brass); }
.pt-derived td:nth-child(1), .pt-derived td:nth-child(3) { color: var(--bone-dim); }
.pt-talent { border-bottom: 1px solid var(--border); padding: 0.4rem 0; font-size: 0.88rem; }
.pt-grave { font-size: 0.85rem; padding: 0.15rem 0; color: var(--bone-dim); }
.pt-equip-line { margin: 0.8rem 0; font-size: 0.9rem; }

/* ============ Impression ============ */

@media print {
  body { background: #fff !important; color: #111 !important; }
  .no-print, .site-header, .tabs { display: none !important; }
  main { max-width: 100%; padding: 0; }
  .view { display: none !important; }
  #view-print.view { display: block !important; }
  .print-sheet { background: #fff; border: none; color: #111; padding: 0; }
  .print-sheet h2 { color: #333; border-color: #999; }
  .pt-table th { background: #eee; color: #111; }
  .pt-table th, .pt-table td { border-color: #999; }
  a { color: inherit; text-decoration: none; }
}

</style>
</head>
<body>

<header class="site-header no-print">
  <div class="aquila">✠</div>
  <h1 class="site-title">ARCHIVUM TACTICUS</h1>
  <div class="site-subtitle">Gestionnaire de personnages — Wrath &amp; Glory</div>
</header>

<nav class="tabs no-print">
  <button class="tab-btn active" data-view="list">Personnages</button>
  <button class="tab-btn" data-view="sheet">Fiche</button>
  <button class="tab-btn" data-view="codex">Codex</button>
</nav>

<main>

  <section id="view-list" class="view active">
    <div class="panel">
      <h2 class="section-title">Vos Personnages</h2>
      <div id="char-list" class="char-grid"></div>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" id="new-char-btn">+ Nouveau Personnage</button>
    </div>
  </section>

  <section id="view-sheet" class="view">
    <div id="sheet-content"></div>
  </section>

  <section id="view-codex" class="view">
    <div class="panel">
      <h2 class="section-title">Codex</h2>
      <div class="subtabs">
        <button class="subtab-btn active" data-codex="attributs">Attributs</button>
        <button class="subtab-btn" data-codex="competences">Compétences</button>
        <button class="subtab-btn" data-codex="especes">Espèces</button>
        <button class="subtab-btn" data-codex="archetypes">Archétypes</button>
        <button class="subtab-btn" data-codex="dons">Dons</button>
        <button class="subtab-btn" data-codex="armurerie">Armurerie</button>
        <button class="subtab-btn" data-codex="psychique">Pouvoirs Psychiques</button>
        <button class="subtab-btn" data-codex="factions">Factions</button>
        <button class="subtab-btn" data-codex="mutations">Mutations</button>
      </div>
      <input type="text" id="codex-search" placeholder="Rechercher dans le Codex...">
    </div>
    <div class="panel">
      <div id="codex-content"></div>
    </div>
  </section>

  <section id="view-print" class="view">
    <div class="btn-row no-print">
      <button class="btn" id="print-back">&larr; Retour à la fiche</button>
      <button class="btn btn-primary" id="print-now">Imprimer / Exporter en PDF</button>
    </div>
    <div id="print-content"></div>
  </section>

</main>

<script>

// ==== js/data/core.js ====
// ============================================================
// WRATH & GLORY — DONNÉES DE BASE (Attributs, Compétences, Espèces)
// Terminologie alignée sur la fiche de personnage officielle FR.
// Contenu reformulé à partir du manuel de règles, à usage personnel.
// ============================================================

const ATTRIBUTES = [
  { key: "F",   name: "Force",         full: "Strength",   desc: "La puissance physique brute : la force de frappe au corps à corps et la capacité à porter des charges ou de l'équipement lourd." },
  { key: "E",   name: "Endurance",     full: "Toughness",  desc: "La résistance du corps aux blessures, aux poisons et aux maladies, ainsi que la capacité à encaisser les dégâts." },
  { key: "A",   name: "Agilité",       full: "Agility",    desc: "La coordination et la dextérité fine : précision au tir, pilotage, contrôle des mouvements." },
  { key: "I",   name: "Initiative",    full: "Initiative", desc: "La vivacité des réflexes et la capacité à réagir vite, en particulier au corps à corps ou sous pression." },
  { key: "FM",  name: "Force Mentale", full: "Willpower",  desc: "La force mentale, le sang-froid et la résistance à la tentation, à la peur ou aux pouvoirs du Warp." },
  { key: "Int", name: "Intellect",     full: "Intellect",  desc: "La capacité à observer, mémoriser, raisonner et exploiter des connaissances (histoire, technologie, médecine...)." },
  { key: "Soc", name: "Sociabilité",   full: "Fellowship", desc: "Le charisme et la présence sociale : convaincre, mentir, détecter le mensonge, s'intégrer à un groupe." },
  { key: "Spd", name: "Vitesse",       full: "Speed",      desc: "La vitesse de déplacement du personnage. Ne se dépense pas en XP comme les autres Attributs : dépend de l'Espèce." }
];

// Coût en XP pour acheter un rang d'Attribut (1 à 12)
const ATTRIBUTE_XP_TABLE = {
  1: { total: 0,   incremental: 0 },
  2: { total: 4,   incremental: 4 },
  3: { total: 10,  incremental: 6 },
  4: { total: 20,  incremental: 10 },
  5: { total: 35,  incremental: 15 },
  6: { total: 55,  incremental: 20 },
  7: { total: 80,  incremental: 25 },
  8: { total: 110, incremental: 30 },
  9: { total: 145, incremental: 35 },
  10: { total: 185, incremental: 40 },
  11: { total: 230, incremental: 45 },
  12: { total: 280, incremental: 50 }
};

// Coût en XP pour acheter un rang de Compétence (0 à 8)
const SKILL_XP_TABLE = {
  0: { total: 0,  incremental: 0 },
  1: { total: 2,  incremental: 2 },
  2: { total: 6,  incremental: 4 },
  3: { total: 12, incremental: 6 },
  4: { total: 20, incremental: 8 },
  5: { total: 30, incremental: 10 },
  6: { total: 42, incremental: 12 },
  7: { total: 56, incremental: 14 },
  8: { total: 72, incremental: 16 }
};

// Maximum d'Attribut selon l'Espèce
const ATTRIBUTE_MAX_BY_SPECIES = {
  "Humain":            { F: 8,  E: 8,  A: 8,  I: 8,  FM: 8,  Int: 8,  Soc: 8, Spd: 8 },
  "Ork":                { F: 12, E: 12, A: 7,  I: 7,  FM: 8,  Int: 7,  Soc: 7, Spd: 7 },
  "Aeldari":            { F: 7,  E: 7,  A: 12, I: 12, FM: 12, Int: 10, Soc: 6, Spd: 10 },
  "Adeptus Astartes":   { F: 10, E: 10, A: 9,  I: 9,  FM: 10, Int: 10, Soc: 8, Spd: 9 },
  "Primaris Astartes":  { F: 12, E: 12, A: 9,  I: 9,  FM: 10, Int: 10, Soc: 8, Spd: 9 }
};

// Compétences (nom, Attribut associé, description reformulée)
const SKILLS = [
  { name: "Athlétisme",         attr: "F",   desc: "Courir, sauter, nager : l'ensemble des efforts physiques dépendant de la force." },
  { name: "Capacité de Combat", attr: "I",   desc: "Maîtrise du combat rapproché, armé ou à mains nues." },
  { name: "Capacité de Tir",    attr: "A",   desc: "Maîtrise des armes à distance : viser, entretenir, identifier une arme de tir." },
  { name: "Commandement",       attr: "FM",  desc: "Inspirer le respect et pousser d'autres personnes à agir, parfois au-delà de leurs limites." },
  { name: "Connaissance",       attr: "Int", desc: "Se rappeler un savoir issu de ses études, qu'il soit courant ou ésotérique." },
  { name: "Duperie",            attr: "Soc", desc: "Mentir de façon convaincante, manipuler par les mots." },
  { name: "Furtivité",          attr: "A",   desc: "Se cacher, se déplacer sans être repéré, neutraliser un système de sécurité." },
  { name: "Intimidation",       attr: "FM",  desc: "Effrayer quelqu'un pour le faire céder, par la menace ou la coercition." },
  { name: "Investigation",      attr: "Int", desc: "Déchiffrer des indices, mener des recherches, recouper des informations." },

// ==== js/rules.js ====
// ============================================================
// CALCULS DÉRIVÉS — formules officielles (manuel de règles)
// ============================================================

function getSpecies(name) {
  return SPECIES.find(s => s.name === name) || SPECIES[0];
}

// Total d'un Attribut = score acheté + bonus d'Espèce
function attributeTotal(c, key) {
  const species = getSpecies(c.species);
  const score = (c.attributes && c.attributes[key]) || 1;
  const bonus = (species.attrBonus && species.attrBonus[key]) || 0;
  return score + bonus;
}

// Total d'une Compétence = rang acheté + Total de l'Attribut associé + bonus d'Espèce
function skillTotal(c, skillName) {
  const skill = SKILLS.find(s => s.name === skillName);
  if (!skill) return 0;
  const species = getSpecies(c.species);
  const rank = (c.skills && c.skills[skillName]) || 0;
  const attrTot = attributeTotal(c, skill.attr);
  const speciesSkillBonus = (species.skillBonus && species.skillBonus[skillName]) || 0;
  return rank + attrTot + speciesSkillBonus;
}

// Meilleure Armure équipée (pour la Résistance)
function bestArmourRating(c) {
  if (!c.armours || c.armours.length === 0) return 0;
  let best = 0;
  c.armours.forEach(a => {
    const ar = parseInt(String(a.ar).replace("*", ""), 10);
    if (!isNaN(ar) && ar > best) best = ar;
  });
  return best;
}

function computeDerived(c) {
  const species = getSpecies(c.species);
  const I = attributeTotal(c, "I");
  const E = attributeTotal(c, "E");
  const FM = attributeTotal(c, "FM");
  const Soc = attributeTotal(c, "Soc");
  const vigilanceTotal = skillTotal(c, "Vigilance");
  const armourAR = bestArmourRating(c);

  return {
    defense: I - 1,
    resistanceBase: E + 1,
    resistanceArmour: armourAR,
    resistanceTotal: E + 1 + armourAR,
    blessuresMax: E + (2 * c.tier),
    stressMax: FM + c.tier,
    determination: E,
    resolution: Math.max(1, FM - 1),
    conviction: FM,
    influence: Math.max(0, Soc - 1),
    richesse: c.tier + (c.richesseBonus || 0),
    taille: species.size,
    vitesse: species.speed,
    vigilancePassive: Math.ceil(vigilanceTotal / 2),
    blessuresGravesMax: c.tier + 1
  };
}

// ---------- Calcul de l'XP dépensée ----------

function talentXpValue(talentName) {
  const t = TALENTS.find(t => t.name === talentName);
  if (!t) return 0;
  const n = parseInt(String(t.xp), 10);
  return isNaN(n) ? 0 : n;
}

function computeXpSpent(c) {
  let total = 0;
  const species = getSpecies(c.species);
  total += species.xpCost || 0;

  Object.entries(c.attributes || {}).forEach(([key, rating]) => {
    total += (ATTRIBUTE_XP_TABLE[rating] || { total: 0 }).total;
  });
  Object.entries(c.skills || {}).forEach(([name, rating]) => {
    total += (SKILL_XP_TABLE[rating] || { total: 0 }).total;
  });
  (c.talents || []).forEach(name => { total += talentXpValue(name); });
  total += (c.richesseBonus || 0); // 1 XP par point de Richesse supplémentaire

  return total;
}


// ==== js/storage.js ====
// ============================================================
// STOCKAGE LOCAL DES PERSONNAGES
// Utilise le localStorage du navigateur (site statique, aucun serveur).
// ============================================================

const STORAGE_KEY = "wg_characters_v2";

function loadCharacters() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch (e) {
    console.error("Erreur de lecture du stockage :", e);
    return [];
  }
}

function saveCharacters(characters) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(characters));
    return true;
  } catch (e) {
    console.error("Erreur d'écriture du stockage (image trop lourde ?) :", e);
    alert("Erreur d'enregistrement : le stockage local est peut-être plein (l'image du portrait est-elle très volumineuse ?).");
    return false;
  }
}

function createBlankCharacter(name) {
  const attrs = {};
  ATTRIBUTES.forEach(a => { if (a.key !== "Spd") attrs[a.key] = 1; });

  const skills = {};
  SKILLS.forEach(s => { skills[s.name] = 0; });

  return {
    id: "char_" + Date.now() + "_" + Math.random().toString(36).slice(2, 8),
    playerName: "",
    name: name || "Nouveau Personnage",
    image: null,
    species: "Humain",
    archetype: "",
    historique: "",
    faction: "",
    motsCles: "",
    tier: 1,
    rang: 1,
    xpTotal: 0,
    attributes: attrs,
    skills: skills,
    talents: [],
    weapons: [],
    armours: [],
    equipment: [],
    wounds: 0,
    shock: 0,
    corruption: 0,
    foiMax: 0,
    foiCurrent: 0,
    fureur: 0,
    gloire: 0,
    richesseBonus: 0,
    blessuresGraves: ["", "", "", "", "", ""],
    blessuresGuerre: "",
    mutations: "",
    psychicPowers: [],
    notes: "",
    cadreCampagne: "",
    bonusCadreCampagne: "",
    createdAt: new Date().toISOString()
  };
}

// Ajoute les valeurs par défaut à un personnage sauvegardé avec un ancien schéma
function migrateCharacter(c) {
  const blank = createBlankCharacter(c.name);
  const merged = Object.assign({}, blank, c);
  // Migration ancienne clé "wargear" (liste de textes) -> equipment
  if (c.wargear && Array.isArray(c.wargear) && (!c.weapons || c.weapons.length === 0) && (!c.equipment || c.equipment.length === 0)) {
    merged.equipment = c.wargear.slice();
  }
  return merged;
}

function upsertCharacter(character) {
  const chars = loadCharacters();
  const idx = chars.findIndex(c => c.id === character.id);
  if (idx >= 0) {
    chars[idx] = character;
  } else {
    chars.push(character);
  }
  return saveCharacters(chars);
}

function deleteCharacter(id) {
  const chars = loadCharacters().filter(c => c.id !== id);
  saveCharacters(chars);
}

function getCharacter(id) {
  const c = loadCharacters().find(c => c.id === id) || null;
  return c ? migrateCharacter(c) : null;
}

let state = {
  view: "list",       // "list" | "sheet" | "codex" | "print"
  characterId: null,
  codexTab: "attributs"
};

function switchTab(view) {
  state.view = view;
  document.querySelectorAll(".tab-btn").forEach(b => b.classList.toggle("active", b.dataset.view === view));
  document.querySelectorAll(".view").forEach(v => v.classList.toggle("active", v.id === "view-" + view));
  if (view === "list") renderCharacterList();
  if (view === "codex") renderCodex();
}

// ---------- Vue : Liste des personnages ----------

function renderCharacterList() {
  const chars = loadCharacters();
  const container = document.getElementById("char-list");

  if (chars.length === 0) {
    container.innerHTML = `<div class="empty-state">Aucun personnage pour l'instant.<br>Créez-en un pour commencer.</div>`;
    return;
  }

  container.innerHTML = chars.map(c => `
    <div class="char-card" data-id="${c.id}">
      ${c.image ? `<img class="char-thumb" src="${c.image}" alt="">` : `<div class="char-thumb char-thumb-empty">✠</div>`}
      <div class="char-card-info">
        <div class="cname">${escapeHtml(c.name)}</div>
        <div class="cmeta">${escapeHtml(c.species)} · ${escapeHtml(c.archetype || "Archétype non défini")} · Palier ${c.tier}</div>
      </div>
    </div>
  `).join("");

  container.querySelectorAll(".char-card").forEach(card => {
    card.addEventListener("click", () => openCharacterSheet(card.dataset.id));
  });
}

function newCharacter() {
  const c = createBlankCharacter("Nouveau Personnage");
  upsertCharacter(c);
  openCharacterSheet(c.id);
}

  state.characterId = id;
  switchTab("sheet");
  renderCharacterSheet();

function bindSheetEvents(c) {
  document.getElementById("back-to-list").addEventListener("click", () => switchTab("list"));
  document.getElementById("save-char").addEventListener("click", saveCharacterFromForm);
  document.getElementById("print-char").addEventListener("click", () => {
    saveCharacterFromForm(true);
    openPrintSheet(c.id);
  });
  document.getElementById("delete-char").addEventListener("click", () => {
    if (confirm("Supprimer définitivement ce personnage ?")) {
      deleteCharacter(c.id);
      switchTab("list");
    }
  });

  // Portrait
  document.getElementById("f-image").addEventListener("change", (e) => handleImageUpload(e, c.id));
  const removeBtn = document.getElementById("remove-image");
  if (removeBtn) removeBtn.addEventListener("click", () => {
    const cur = getCharacter(c.id);
    cur.image = null;
    upsertCharacter(cur);
    renderCharacterSheet();
  });

  // Talents
  document.getElementById("add-talent").addEventListener("click", () => {
    const select = document.getElementById("new-talent-select");
    if (!select.value) return;
    mutateCharacter(c.id, cur => cur.talents.push(select.value));
  });

  // Appliquer les suggestions d'Archétype
  document.getElementById("apply-archetype").addEventListener("click", () => {
    const archName = document.getElementById("f-archetype").value;
    const d = ARCHETYPE_DETAILS[archName];
    if (!d) { alert("Choisissez d'abord un Archétype dans la liste, ou aucune donnée détaillée n'est disponible pour celui-ci."); return; }
    if (!confirm(`Appliquer les valeurs suggérées de "${archName}" ? Cela va définir l'Espèce, les Attributs (si disponibles), et ajouter les Dons/Équipement suggérés à ce qui existe déjà.`)) return;
    mutateCharacter(c.id, cur => {
      cur.species = d.species;
      cur.motsCles = d.keywords;
      const faction = FACTIONS.find(f => f.archetypes && f.archetypes.some(a => a.name === archName));
      if (faction) cur.faction = faction.name;
      const attrKeys = ATTRIBUTES.filter(a => a.key !== "Spd").map(a => a.key);
      if (!d.attrs.some(v => v == null)) {
        attrKeys.forEach((k, i) => { cur.attributes[k] = d.attrs[i]; });
      }
      if (d.wargear && d.wargear !== "—") cur.equipment.push(d.wargear);
      if (d.talentsSuggested && d.talentsSuggested !== "—" && !d.talentsSuggested.startsWith("Voir")) {
        d.talentsSuggested.split(",").map(s => s.trim()).forEach(name => {
          const match = TALENTS.find(t => t.name === name);
          if (match && !cur.talents.includes(match.name)) cur.talents.push(match.name);
        });
      }
    });
  });

  // Armes
  document.getElementById("add-weapon").addEventListener("click", () => {
    const val = document.getElementById("new-weapon-select").value;
    if (!val) return;
    const [type, cat, idx] = val.split("|");
    const source = type === "melee" ? MELEE_WEAPONS : RANGED_WEAPONS;
    const w = source[cat][parseInt(idx, 10)];
    const snapshot = Object.assign({ type, reserve: "" }, w);
    mutateCharacter(c.id, cur => cur.weapons.push(snapshot));
  });
  document.getElementById("add-weapon-custom").addEventListener("click", () => {
    const input = document.getElementById("new-weapon-custom");
    const val = input.value.trim();
    if (!val) return;
    mutateCharacter(c.id, cur => cur.weapons.push({ name: val, type: "custom", dmg: "–", ed: "–", ap: "–", traits: "", reserve: "" }));
  });

  // Armure
  document.getElementById("add-armour").addEventListener("click", () => {
    const val = document.getElementById("new-armour-select").value;
    if (!val) return;
    const [cat, idx] = val.split("|");
    const a = ARMOUR[cat][parseInt(idx, 10)];
    mutateCharacter(c.id, cur => cur.armours.push(Object.assign({}, a)));
  });

  // Équipement général
  document.getElementById("add-equipment").addEventListener("click", () => {
    const input = document.getElementById("new-equipment");
    const val = input.value.trim();
    if (!val) return;
    mutateCharacter(c.id, cur => cur.equipment.push(val));
  });

  // Pouvoirs psychiques
  document.getElementById("add-psychic").addEventListener("click", () => {
    mutateCharacter(c.id, cur => cur.psychicPowers.push({ name: "", sd: "", activation: "", duree: "", portee: "", cible: "", effet: "" }));
  });
  document.getElementById("add-psychic-from-codex").addEventListener("click", () => {
    const val = document.getElementById("new-psychic-select").value;
    if (!val) return;
    const parts = val.split("|");
    let p;
    if (parts[0] === "ability") p = PSYKER_ABILITIES[parseInt(parts[1], 10)];
    else if (parts[0] === "minor") p = MINOR_PSYCHIC_POWERS[parseInt(parts[1], 10)];
    else p = PSYCHIC_DISCIPLINES[parts[1]][parseInt(parts[2], 10)];
    mutateCharacter(c.id, cur => cur.psychicPowers.push({
      name: p.name, sd: p.dn, activation: p.activation, duree: p.duration,
      portee: p.range, cible: p.multi || "", effet: p.effect
    }));
  });

  // Édition inline des lignes Pouvoirs Psychiques
  document.getElementById("psychic-table").addEventListener("change", (e) => {
    const idx = e.target.dataset.pidx;
    const field = e.target.dataset.pfield;
    if (idx === undefined || !field) return;
    mutateCharacter(c.id, cur => { cur.psychicPowers[idx][field] = e.target.value; }, false);
  });

  // Édition inline Réserve des armes
  document.getElementById("weapons-table").addEventListener("change", (e) => {
    const idx = e.target.dataset.widx;
    if (idx === undefined) return;
    mutateCharacter(c.id, cur => { cur.weapons[idx].reserve = e.target.value; }, false);
  });
}

// Applique une mutation au personnage en partant de l'état ACTUEL du
// formulaire (pas seulement de la dernière version enregistrée), pour ne
// jamais perdre une modification en cours (Attributs, Notes...) quand on
// clique sur "Ajouter" ou "Supprimer" sur une autre section de la fiche.
// rerender=false évite de perdre le focus d'un champ texte en cours de frappe.
function mutateCharacter(id, mutator, rerender = true) {
  const stored = getCharacter(id);
  const cur = document.getElementById("f-name") ? readFormAsCharacter(stored) : stored;
  mutator(cur);
  upsertCharacter(cur);
  if (rerender) renderCharacterSheet();
}

function renderTalentList(talents) {
  if (!talents || talents.length === 0) return `<div class="note">Aucun don pour l'instant.</div>`;
  return talents.map((name, i) => {
    const t = TALENTS.find(t => t.name === name);
    return `<div class="talent-row">
      <div>
        <strong>${escapeHtml(name)}</strong>${t ? ` <span class="entry-tag">${t.xp} XP</span>` : ""}
        ${t && t.req ? `<div class="note">Prérequis : ${escapeHtml(t.req)}</div>` : ""}
        ${t ? `<div class="note">${escapeHtml(t.desc)}</div>` : ""}
      </div>
      <button class="btn btn-danger" data-del-field="talents" data-del-idx="${i}" type="button">&times;</button>
    </div>`;
  }).join("");
}

function renderWeaponRows(weapons) {
  if (!weapons || weapons.length === 0) return `<tr><td colspan="9" class="note">Aucune arme équipée.</td></tr>`;
  return weapons.map((w, i) => {
    const range = w.type === "ranged" ? `${w.short}/${w.med}/${w.long}` : (w.range || "–");
    return `<tr>
      <td>${escapeHtml(w.name)}</td>
      <td><input type="text" data-widx="${i}" value="${escapeHtml(w.reserve || "")}" style="width:4rem;"></td>
      <td>${w.dmg}</td>
      <td>${w.ed}</td>
      <td>${w.ap}</td>
      <td>${w.salvo != null ? w.salvo : "–"}</td>
      <td>${range}</td>
      <td>${w.traits || "–"}</td>
      <td><button class="btn btn-danger" data-del-field="weapons" data-del-idx="${i}" type="button">&times;</button></td>
    </tr>`;
  }).join("");
}

function renderArmourRows(armours) {
  if (!armours || armours.length === 0) return `<tr><td colspan="4" class="note">Aucune armure équipée.</td></tr>`;
  return armours.map((a, i) => `<tr>
    <td>${escapeHtml(a.name)}</td>
    <td>${a.ar}</td>
    <td>${a.traits || "–"}</td>
    <td><button class="btn btn-danger" data-del-field="armours" data-del-idx="${i}" type="button">&times;</button></td>

function renderPsychicRows(powers) {
  if (!powers || powers.length === 0) return `<tr><td colspan="8" class="note">Aucun pouvoir enregistré.</td></tr>`;
  const cols = ["name","sd","activation","duree","portee","cible","effet"];
  return powers.map((p, i) => `<tr>
    ${cols.map(col => `<td><input type="text" data-pidx="${i}" data-pfield="${col}" value="${escapeHtml(p[col] || "")}" style="width:${col === "effet" ? "12rem" : col === "name" ? "8rem" : "5rem"};"></td>`).join("")}
    <td><button class="btn btn-danger" data-del-field="psychicPowers" data-del-idx="${i}" type="button">&times;</button></td>
  </tr>`).join("");
}

function renderTagList(items, field) {
  if (!items || items.length === 0) return `<div class="note">Aucun élément pour l'instant.</div>`;
  return items.map((item, i) => `
    <span class="tag-chip">${escapeHtml(item)} <button data-del-field="${field}" data-del-idx="${i}" type="button">&times;</button></span>
  `).join("");

// ---------- Photo ----------

function handleImageUpload(e, charId) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    const img = new Image();
    img.onload = () => {
      const maxDim = 500;
      let w = img.width, h = img.height;
      if (w > h && w > maxDim) { h = Math.round(h * maxDim / w); w = maxDim; }
      else if (h > maxDim) { w = Math.round(w * maxDim / h); h = maxDim; }
      const canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      canvas.getContext("2d").drawImage(img, 0, 0, w, h);
      const dataUrl = canvas.toDataURL("image/jpeg", 0.82);
      const cur = getCharacter(charId);
      cur.image = dataUrl;
      upsertCharacter(cur);
      renderCharacterSheet();
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

// ---------- Sauvegarde du formulaire ----------

function readFormAsCharacter(base) {
  const c = Object.assign({}, base);
  c.playerName = val("f-playername");
  c.name = val("f-name") || "Sans nom";
  c.tier = intVal("f-tier", 1);
  c.rang = intVal("f-rang", 1);
  c.species = val("f-species");
  c.archetype = val("f-archetype");
  c.faction = val("f-faction");
  c.motsCles = val("f-motscles");
  c.historique = val("f-historique");
  c.xpTotal = intVal("f-xptotal", 0);
  c.wounds = intVal("f-wounds", 0);
  c.shock = intVal("f-shock", 0);
  c.corruption = intVal("f-corruption", 0);
  c.fureur = intVal("f-fureur", 0);
  c.gloire = intVal("f-gloire", 0);
  c.richesseBonus = intVal("f-richessebonus", 0);
  c.foiMax = intVal("f-foimax", 0);
  c.foiCurrent = intVal("f-foicurrent", 0);
  c.blessuresGuerre = val("f-blessuresguerre");
  c.mutations = val("f-mutations");
  c.cadreCampagne = val("f-cadre");
  c.bonusCadreCampagne = val("f-cadrebonus");
  c.notes = val("f-notes");

  c.attributes = {};
  document.querySelectorAll("input[data-attr]").forEach(inp => {
    c.attributes[inp.dataset.attr] = parseInt(inp.value, 10) || 1;
  });
  c.skills = {};
  document.querySelectorAll("input[data-skill]").forEach(inp => {
    c.skills[inp.dataset.skill] = parseInt(inp.value, 10) || 0;
  });
  c.blessuresGraves = [];
  document.querySelectorAll("input[data-grave]").forEach(inp => {
    c.blessuresGraves[parseInt(inp.dataset.grave, 10)] = inp.value;
  });

  return c;
}

function val(id) {
  const el = document.getElementById(id);
  return el ? el.value : "";
}
function intVal(id, fallback) {
  const el = document.getElementById(id);
  const n = el ? parseInt(el.value, 10) : NaN;
  return isNaN(n) ? fallback : n;
}

function saveCharacterFromForm(silent) {
  const base = getCharacter(state.characterId);
  const updated = readFormAsCharacter(base);
  upsertCharacter(updated);
  if (!silent) switchTab("list");
}

// ---------- Vue : Codex ----------

function renderCodex() {
  const container = document.getElementById("codex-content");
  document.querySelectorAll(".subtab-btn").forEach(b => b.classList.toggle("active", b.dataset.codex === state.codexTab));

  if (state.codexTab === "attributs") {
    container.innerHTML = ATTRIBUTES.map(a => `
      <div class="codex-entry">
        <span class="entry-name">${a.name}</span><span class="entry-tag">${a.key}</span>
        <div class="entry-desc">${a.desc}</div>
      </div>
    `).join("");
  }

  if (state.codexTab === "competences") {
    container.innerHTML = SKILLS.map(s => `
      <div class="codex-entry">
        <span class="entry-name">${s.name}</span><span class="entry-tag">${s.attr}</span>
        <div class="entry-desc">${s.desc}</div>
      </div>
    `).join("");
  }

  if (state.codexTab === "especes") {
    container.innerHTML = SPECIES.map(s => `
      <div class="codex-entry">
        <span class="entry-name">${s.name}</span><span class="entry-tag">${s.xpCost} XP · Vitesse ${s.speed} · Taille ${s.size}</span>
        <div class="entry-desc">${s.abilities.length ? s.abilities.join("<br>") : "Aucun trait particulier — plus de points d'expérience à répartir librement."}</div>
      </div>
    `).join("");
  }

  if (state.codexTab === "archetypes") {
    const byTier = [1,2,3,4].map(t => `
      <h3 class="codex-subhead">PALIER ${t}</h3>
      ${ARCHETYPES.filter(a => a.tier === t).map(a => {
        const d = ARCHETYPE_DETAILS[a.name];
        if (!d) return `<div class="codex-entry"><span class="entry-name">${a.name}</span><span class="entry-tag">p.${a.page}</span></div>`;
        const attrLabels = ATTRIBUTES.filter(x => x.key !== "Spd").map(x => x.key);
        const attrLine = d.attrs.some(v => v == null) ? "Voir bonus d'Espèce" : attrLabels.map((k,i) => `${k} ${d.attrs[i]}`).join(" · ");
        return `<div class="codex-entry">
          <span class="entry-name">${a.name}</span><span class="entry-tag">${d.species} · ${d.xpCost} XP</span>
          <div class="entry-desc"><em>Mots-clés :</em> ${d.keywords}</div>
          <div class="entry-desc"><strong>${d.abilityName}</strong> — ${d.abilityText}</div>
          <div class="entry-desc"><em>Attributs suggérés :</em> ${attrLine}</div>
          <div class="entry-desc"><em>Compétences suggérées :</em> ${d.skillsSuggested}</div>
          <div class="entry-desc"><em>Dons suggérés :</em> ${d.talentsSuggested}</div>
          <div class="entry-desc"><em>Équipement :</em> ${d.wargear}</div>
        </div>`;
      }).join("")}
    `).join("");
    container.innerHTML = byTier;
  }

  if (state.codexTab === "dons") {
    const q = (document.getElementById("codex-search").value || "").toLowerCase();
    const filtered = TALENTS.filter(t => t.name.toLowerCase().includes(q) || t.desc.toLowerCase().includes(q));
    container.innerHTML = filtered.map(t => `
      <div class="codex-entry">
        <span class="entry-name">${t.name}</span><span class="entry-tag">${t.xp} XP</span>
        ${t.req ? `<div class="entry-desc"><em>Prérequis :</em> ${t.req}</div>` : ""}
        <div class="entry-desc">${t.desc}</div>
      </div>
    `).join("") || `<p class="note">Aucun don ne correspond à « ${escapeHtml(q)} ».</p>`;
  }

  if (state.codexTab === "armurerie") {
    const q = (document.getElementById("codex-search").value || "").toLowerCase();
    let html = "";
    html += `<h3 class="codex-subhead">ARMES DE MÊLÉE</h3>`;
    Object.entries(MELEE_WEAPONS).forEach(([cat, items]) => {
      const filtered = items.filter(w => w.name.toLowerCase().includes(q));
      if (filtered.length === 0) return;
      html += renderMeleeTable(cat, filtered);
    });
    html += `<h3 class="codex-subhead">ARMES À DISTANCE</h3>`;
    Object.entries(RANGED_WEAPONS).forEach(([cat, items]) => {
      const filtered = items.filter(w => w.name.toLowerCase().includes(q));
      if (filtered.length === 0) return;
      html += renderRangedTable(cat, filtered);
    });
    html += `<h3 class="codex-subhead">ARMURES</h3>`;
    Object.entries(ARMOUR).forEach(([cat, items]) => {
      const filtered = items.filter(a => a.name.toLowerCase().includes(q));
      if (filtered.length === 0) return;
      html += renderArmourTable(cat, filtered);
    });
    if (!q) {
      html += `<h3 class="codex-subhead">TRAITS D'ARMES</h3>`;
      html += WEAPON_TRAITS.map(t => `<div class="codex-entry"><span class="entry-name">${t.name}</span><div class="entry-desc">${t.desc}</div></div>`).join("");
    }
    container.innerHTML = html;
  }

  if (state.codexTab === "psychique") {
    const q = (document.getElementById("codex-search").value || "").toLowerCase();
    let html = "";
    if (!q) {
      html += `<h3 class="codex-subhead">APTITUDES UNIVERSELLES (gratuites, tout PSYKER)</h3>`;
      html += PSYKER_ABILITIES.map(p => renderPowerEntry(p, true)).join("");
      html += `<h3 class="codex-subhead">POUVOIRS MINEURS</h3>`;
      html += MINOR_PSYCHIC_POWERS.filter(p => p.name.toLowerCase().includes(q)).map(p => renderPowerEntry(p)).join("");
    }
    Object.entries(PSYCHIC_DISCIPLINES).forEach(([disc, powers]) => {
      const filtered = powers.filter(p => p.name.toLowerCase().includes(q));
      if (filtered.length === 0) return;
      html += `<h3 class="codex-subhead">${disc.toUpperCase()}</h3>`;
      html += filtered.map(p => renderPowerEntry(p)).join("");
    });
    if (q) {
      const minorFiltered = MINOR_PSYCHIC_POWERS.filter(p => p.name.toLowerCase().includes(q));
      if (minorFiltered.length) html = `<h3 class="codex-subhead">POUVOIRS MINEURS</h3>` + minorFiltered.map(p => renderPowerEntry(p)).join("") + html;
    }
    container.innerHTML = html || `<p class="note">Aucun pouvoir ne correspond à « ${escapeHtml(q)} ».</p>`;
  }

  if (state.codexTab === "factions") {
    container.innerHTML = FACTIONS.map(f => `
      <div class="codex-entry">
        <span class="entry-name">${f.name}</span><span class="entry-tag">${f.keywords}</span>
        <div class="entry-desc">${f.overview}</div>
        ${f.placeholderNote ? `<div class="entry-desc"><em>${f.placeholderNote}</em></div>` : ""}
        ${f.archetypes && f.archetypes.length ? `<div class="entry-desc"><em>Archétypes :</em> ${f.archetypes.map(a => `${a.name} (Palier ${a.tier})`).join(", ")}</div>` : ""}
      </div>
    `).join("");
  }

  if (state.codexTab === "mutations") {
    const q = (document.getElementById("codex-search").value || "").toLowerCase();
    let html = `<p class="note">Test de Mutation : Conviction contre DD 3 (+ Niveau de Corruption). En cas d'échec, jet de sévérité 1d6 (1-2 Subtile, 3-4 Mineure, 5-6 Sévère) puis d66 sur la table (+10 par mutation déjà possédée).</p>`;
    Object.entries(MUTATIONS).forEach(([severity, list]) => {
      const filtered = list.filter(m => m.name.toLowerCase().includes(q));
      if (filtered.length === 0) return;
      html += `<h3 class="codex-subhead">${severity.toUpperCase()}</h3>`;
      html += filtered.map(m => `
        <div class="codex-entry">
          <span class="entry-name">${m.name}</span><span class="entry-tag">d66 : ${m.roll}</span>
          <div class="entry-desc">${m.effect}</div>
        </div>
      `).join("");
    });
    if (!q) {
      html += `<h3 class="codex-subhead">MUTATIONS SCAVVY</h3><p class="entry-desc">${SCAVVY_MUTATIONS.join(", ")}</p>`;
    }
    container.innerHTML = html;
  }
}

function renderPowerEntry(p, isAbility) {
  return `<div class="codex-entry">
    <span class="entry-name">${p.name}</span><span class="entry-tag">${isAbility ? "Gratuit" : (p.xp + " XP")} · DD ${p.dn}</span>
    <div class="entry-desc"><em>${p.activation} · ${p.duration} · Portée ${p.range}${p.multi ? " · Multi-cible: " + p.multi : ""}</em></div>
    <div class="entry-desc">${p.effect}</div>
  </div>`;
}

function renderMeleeTable(cat, items) {
  const rows = items.map(w => `<tr><td>${w.name}</td><td>${w.dmg}</td><td>${w.ed}</td><td>${w.ap}</td><td>${w.range}</td><td>${w.traits || "–"}</td><td>${w.value}</td><td>${w.rarity}</td></tr>`).join("");
  return `<div class="table-wrap"><div class="note">${cat}</div>
    <table class="codex-table"><thead><tr><th>Nom</th><th>Dégâts</th><th>DS</th><th>PA</th><th>Portée</th><th>Traits</th><th>Val.</th><th>Rareté</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

function renderRangedTable(cat, items) {
  const rows = items.map(w => `<tr><td>${w.name}</td><td>${w.dmg}</td><td>${w.ed}</td><td>${w.ap}</td><td>${w.short}/${w.med}/${w.long}</td><td>${w.salvo}</td><td>${w.traits || "–"}</td><td>${w.value}</td><td>${w.rarity}</td></tr>`).join("");
  return `<div class="table-wrap"><div class="note">${cat}</div>
    <table class="codex-table"><thead><tr><th>Nom</th><th>Dégâts</th><th>DS</th><th>PA</th><th>Portée</th><th>Salve</th><th>Traits</th><th>Val.</th><th>Rareté</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

function renderArmourTable(cat, items) {
  const rows = items.map(a => `<tr><td>${a.name}</td><td>${a.ar}</td><td>${a.traits}</td><td>${a.value}</td><td>${a.rarity}</td></tr>`).join("");
  return `<div class="table-wrap"><div class="note">${cat}</div>
    <table class="codex-table"><thead><tr><th>Nom</th><th>AR</th><th>Traits</th><th>Val.</th><th>Rareté</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

function switchCodexTab(tab) {
  state.codexTab = tab;
  renderCodex();
}

// ---------- Vue : Fiche imprimable ----------

function openPrintSheet(id) {
  state.characterId = id;
  switchTab("print");
  renderPrintSheet();
}

function renderPrintSheet() {
  const c = getCharacter(state.characterId);
  if (!c) { switchTab("list"); return; }
  const d = computeDerived(c);

  const attrRow = (label) => ATTRIBUTES.filter(a => a.key !== "Spd").map(a => {
    const score = (c.attributes && c.attributes[a.key]) || 1;
    const species = getSpecies(c.species);
    const bonus = (species.attrBonus && species.attrBonus[a.key]) || 0;
    const total = score + bonus;
    if (label === "score") return `<td>${score}</td>`;
    if (label === "bonus") return `<td>${bonus}</td>`;
    return `<td><strong>${total}</strong></td>`;
  }).join("");

  const skillLeft = SKILLS.slice(0, 9);
  const skillRight = SKILLS.slice(9);
  const skillRow = (s) => `<tr><td>${s.name} <small>(${s.attr})</small></td><td>${(c.skills && c.skills[s.name]) || 0}</td><td><strong>${skillTotal(c, s.name)}</strong></td></tr>`;

  const weaponsRows = (c.weapons || []).map(w => {
    const range = w.type === "ranged" ? `${w.short}/${w.med}/${w.long}` : (w.range || "–");
    return `<tr><td>${escapeHtml(w.name)}</td><td>${escapeHtml(w.reserve || "")}</td><td>${w.dmg}</td><td>${w.ed}</td><td>${w.ap}</td><td>${w.salvo != null ? w.salvo : "–"}</td><td>${range}</td><td>${w.traits || "–"}</td></tr>`;
  }).join("") || `<tr><td colspan="8">—</td></tr>`;

  const armourRows = (c.armours || []).map(a => `<tr><td>${escapeHtml(a.name)}</td><td>${a.ar}</td><td>${a.traits || "–"}</td></tr>`).join("") || `<tr><td colspan="3">—</td></tr>`;

  const talentsText = (c.talents || []).map(name => {
    const t = TALENTS.find(t => t.name === name);
    return `<div class="pt-talent"><strong>${escapeHtml(name)}</strong>${t ? ` — ${escapeHtml(t.desc)}` : ""}</div>`;
  }).join("") || `<div class="pt-empty">—</div>`;

  const psychicRows = (c.psychicPowers || []).filter(p => p.name).map(p =>
    `<tr><td>${escapeHtml(p.name)}</td><td>${escapeHtml(p.sd)}</td><td>${escapeHtml(p.activation)}</td><td>${escapeHtml(p.duree)}</td><td>${escapeHtml(p.portee)}</td><td>${escapeHtml(p.cible)}</td><td>${escapeHtml(p.effet)}</td></tr>`
  ).join("") || `<tr><td colspan="7">—</td></tr>`;

  const gravesRows = (c.blessuresGraves || []).map((g, i) => `<div class="pt-grave">${i+1}. ${escapeHtml(g || "—")}</div>`).join("");

  document.getElementById("print-content").innerHTML = `
    <div class="print-sheet">
      <div class="pt-header">
        <div class="pt-portrait">${c.image ? `<img src="${c.image}" alt="">` : ""}</div>
        <div class="pt-identity">
          <h1>${escapeHtml(c.name)}</h1>
          <div>Joueur : ${escapeHtml(c.playerName || "—")}</div>
          <div>Tier : ${c.tier} &nbsp; Rang : ${c.rang || 1} &nbsp; Espèce : ${escapeHtml(c.species)} &nbsp; Archétype : ${escapeHtml(c.archetype || "—")}</div>
          <div>Faction : ${escapeHtml(c.faction || "—")} &nbsp; Mots-Clés : ${escapeHtml(c.motsCles || "—")}</div>
          <div>Historique : ${escapeHtml(c.historique || "—")}</div>
        </div>
      </div>

      <div class="pt-grid-2">
        <div>
          <h2>Attributs</h2>
          <table class="pt-table">
            <thead><tr><th></th>${ATTRIBUTES.filter(a=>a.key!=="Spd").map(a=>`<th>${a.key}</th>`).join("")}</tr></thead>
            <tbody>
              <tr><td>Score</td>${attrRow("score")}</tr>
              <tr><td>Bonus</td>${attrRow("bonus")}</tr>
              <tr><td>Total</td>${attrRow("total")}</tr>
            </tbody>
          </table>

          <h2>Traits Dérivés</h2>
          <table class="pt-table pt-derived">
            <tbody>
              <tr><td>Défense</td><td>${d.defense}</td><td>Taille</td><td>${d.taille}</td></tr>
              <tr><td>Résistance</td><td>${d.resistanceTotal}</td><td>Vitesse</td><td>${d.vitesse}</td></tr>
              <tr><td>Blessures Max</td><td>${d.blessuresMax}</td><td>Actuelles</td><td>${c.wounds || 0}</td></tr>
              <tr><td>Stress Max</td><td>${d.stressMax}</td><td>Actuel</td><td>${c.shock || 0}</td></tr>
              <tr><td>Détermination</td><td>${d.determination}</td><td>Résolution</td><td>${d.resolution}</td></tr>
              <tr><td>Conviction</td><td>${d.conviction}</td><td>Corruption</td><td>${c.corruption || 0} / 25</td></tr>
              <tr><td>Influence</td><td>${d.influence}</td><td>Richesse</td><td>${d.richesse}</td></tr>
              <tr><td>Vigilance Passive</td><td>${d.vigilancePassive}</td><td>Furtivité</td><td>${skillTotal(c,"Furtivité")}</td></tr>
              <tr><td>Fureur</td><td>${c.fureur || 0}</td><td>Gloire</td><td>${c.gloire || 0}</td></tr>
              <tr><td>Foi</td><td>${c.foiCurrent || 0} / ${c.foiMax || 0}</td><td>PX Actuel</td><td>${(c.xpTotal||0) - computeXpSpent(c)}</td></tr>
            </tbody>
          </table>
        </div>

        <div>
          <h2>Compétences</h2>
          <table class="pt-table">
            <thead><tr><th>Compétence</th><th>Score</th><th>Total</th></tr></thead>
            <tbody>${skillLeft.map(skillRow).join("")}${skillRight.map(skillRow).join("")}</tbody>
          </table>
        </div>
      </div>

      <h2>Armes</h2>
      <table class="pt-table">
        <thead><tr><th>Armes</th><th>Réserve</th><th>Dégâts</th><th>DS</th><th>PA</th><th>Salve</th><th>Portée</th><th>Traits</th></tr></thead>
        <tbody>${weaponsRows}</tbody>
      </table>

      <h2>Armure</h2>
      <table class="pt-table">
        <thead><tr><th>Armure</th><th>AR</th><th>Traits</th></tr></thead>
        <tbody>${armourRows}</tbody>
      </table>

      <div class="pt-equip-line"><strong>Équipement :</strong> ${escapeHtml((c.equipment || []).join(", ") || "—")}</div>

      <h2>Talents &amp; Aptitudes</h2>
      <div class="pt-talents">${talentsText}</div>

      <h2>Blessures Graves, Blessures de Guerre &amp; Mutations</h2>
      <div class="pt-grid-3">
        <div><h3>Blessures Graves</h3>${gravesRows}</div>
        <div><h3>Blessures de Guerre</h3><p>${escapeHtml(c.blessuresGuerre || "—")}</p></div>
        <div><h3>Mutations</h3><p>${escapeHtml(c.mutations || "—")}</p></div>
      </div>

      <h2>Pouvoirs Psychiques</h2>
      <table class="pt-table">
        <thead><tr><th>Pouvoir</th><th>SD</th><th>Activation</th><th>Durée</th><th>Portée</th><th>Cible</th><th>Effet</th></tr></thead>
        <tbody>${psychicRows}</tbody>
      </table>

      <h2>Notes</h2>
      <p>${escapeHtml(c.notes || "—")}</p>

      ${(c.cadreCampagne || c.bonusCadreCampagne) ? `
      <h2>Cadre de Campagne</h2>
      <p>${escapeHtml(c.cadreCampagne || "—")}</p>
      <p><em>${escapeHtml(c.bonusCadreCampagne || "")}</em></p>` : ""}
    </div>
  `;
}

// ---------- Utilitaires ----------

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str == null ? "" : String(str);
  return div.innerHTML;
}

// ---------- Initialisation ----------

document.addEventListener("DOMContentLoaded", () => {
  document.querySelectorAll(".tab-btn").forEach(btn => {
    btn.addEventListener("click", () => switchTab(btn.dataset.view));
  });

  // Délégation de suppression liée une seule fois sur le conteneur persistant
  // (sheet-content survit aux ré-affichages ; seul son innerHTML change),
  // pour éviter d'empiler des écouteurs à chaque rendu.
  document.getElementById("sheet-content").addEventListener("click", (e) => {
    const delBtn = e.target.closest("[data-del-field]");
    if (delBtn && state.characterId) {
      const field = delBtn.dataset.delField;
      const idx = parseInt(delBtn.dataset.delIdx, 10);
      mutateCharacter(state.characterId, cur => { cur[field].splice(idx, 1); });
    }
  });
  document.querySelectorAll(".subtab-btn").forEach(btn => {
    btn.addEventListener("click", () => switchCodexTab(btn.dataset.codex));
  });
  document.getElementById("new-char-btn").addEventListener("click", newCharacter);
  document.getElementById("codex-search").addEventListener("input", renderCodex);
  document.getElementById("print-back").addEventListener("click", () => openCharacterSheet(state.characterId));
  document.getElementById("print-now").addEventListener("click", () => window.print());

  switchTab("list");
});


</script>
</body>
</html>
