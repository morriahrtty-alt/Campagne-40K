        <input type="text" id="new-equipment" placeholder="Ajouter un objet...">
        <button class="btn" id="add-equipment" type="button">Ajouter</button>
      </div>
    </div>

    <div class="panel">
      <h2 class="section-title">Blessures Graves <small class="note">(max simultanées : ${derived.blessuresGravesMax})</small></h2>
      <div class="graves-list">
        ${(c.blessuresGraves || ["","","","","",""]).map((v, i) => `
          <div class="field-inline"><label>${i + 1}.</label><input type="text" data-grave="${i}" value="${escapeHtml(v)}"></div>
        `).join("")}
      </div>
      <div class="field-row" style="margin-top:0.8rem;">
        <div class="field"><label>Blessures de Guerre</label><textarea id="f-blessuresguerre" rows="3">${escapeHtml(c.blessuresGuerre || "")}</textarea></div>
        <div class="field"><label>Mutations</label><textarea id="f-mutations" rows="3">${escapeHtml(c.mutations || "")}</textarea></div>
      </div>
    </div>

    <div class="panel">
      <h2 class="section-title">Pouvoirs Psychiques</h2>
      <div style="overflow-x:auto;">
        <table class="codex-table sheet-equip-table" id="psychic-table">
          <thead><tr><th>Pouvoir</th><th>SD</th><th>Activation</th><th>Durée</th><th>Portée</th><th>Cible</th><th>Effet</th><th></th></tr></thead>
          <tbody>${psychicHtml}</tbody>
        </table>
      </div>
      <button class="btn" id="add-psychic" type="button">+ Ajouter une ligne vide</button>
      <div class="list-tag-input" style="margin-top:0.5rem;">
        <select id="new-psychic-select">
          <option value="">— Pré-remplir depuis le Codex —</option>
          ${PSYKER_ABILITIES.map((p, i) => `<option value="ability|${i}">${escapeHtml(p.name)} (aptitude gratuite)</option>`).join("")}
          ${MINOR_PSYCHIC_POWERS.map((p, i) => `<option value="minor|${i}">${escapeHtml(p.name)} (mineur, ${p.xp} XP)</option>`).join("")}
          ${Object.entries(PSYCHIC_DISCIPLINES).flatMap(([disc, powers]) => powers.map((p, i) => `<option value="disc|${disc}|${i}">${escapeHtml(p.name)} (${disc}, ${p.xp} XP)</option>`)).join("")}
        </select>
        <button class="btn" id="add-psychic-from-codex" type="button">Ajouter</button>
      </div>
    </div>

    <div class="panel">
      <h2 class="section-title">Cadre de Campagne</h2>
      <div class="field"><label>Cadre de Campagne</label><textarea id="f-cadre" rows="2">${escapeHtml(c.cadreCampagne || "")}</textarea></div>
      <div class="field"><label>Bonus de Cadre de Campagne</label><textarea id="f-cadrebonus" rows="2">${escapeHtml(c.bonusCadreCampagne || "")}</textarea></div>
    </div>

    <div class="panel">
      <h2 class="section-title">Notes</h2>
      <textarea id="f-notes" rows="4">${escapeHtml(c.notes || "")}</textarea>
    </div>

    <div class="btn-row">
      <button class="btn" id="back-to-list" type="button">&larr; Retour</button>
      <button class="btn btn-primary" id="save-char" type="button">Enregistrer</button>
      <button class="btn" id="print-char" type="button">Fiche Imprimable</button>
      <button class="btn" id="export-pdf-btn" type="button">Exporter en PDF officiel</button>
      <button class="btn btn-danger" id="delete-char" type="button">Supprimer</button>
    </div>
  `;

  bindSheetEvents(c);
}

function renderHistoryList(history) {
  if (!history || history.length === 0) return `<p class="note">Aucune entrée pour l'instant. Les changements de statistiques sont enregistrés automatiquement à chaque sauvegarde.</p>`;
  return history.map(h => `
    <div class="history-entry">
      <div class="history-meta">${formatHistoryDate(h.ts)} — <strong>${escapeHtml(h.label)}</strong></div>
      ${h.diff && h.diff.length ? `<ul class="history-diff">${h.diff.map(d => `<li>${escapeHtml(d)}</li>`).join("")}</ul>` : ""}
    </div>
  `).join("");
}

function formatHistoryDate(iso) {
  try {
    const d = new Date(iso);
    return d.toLocaleDateString("fr-FR", { day: "2-digit", month: "2-digit", year: "numeric" }) + " " + d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
  } catch (e) { return iso; }
}

function bindSheetEvents(c) {
  document.getElementById("back-to-list").addEventListener("click", () => switchTab("list"));
  document.getElementById("save-char").addEventListener("click", saveCharacterFromForm);
  document.getElementById("print-char").addEventListener("click", () => {
    saveCharacterFromForm(true);
    openPrintSheet(c.id);
  });
  document.getElementById("export-pdf-btn").addEventListener("click", () => {
    saveCharacterFromForm(true);
    exportCharacterToPdf(getCharacter(c.id));
  });
  document.getElementById("delete-char").addEventListener("click", () => {
    if (confirm("Supprimer définitivement ce personnage ?")) {
      deleteCharacter(c.id);
      switchTab("list");
    }
  });

  // Historique
  document.getElementById("history-toggle").addEventListener("click", () => {
    const body = document.getElementById("history-body");
    const arrow = document.querySelector(".history-arrow");
    const open = body.style.display !== "none";
    body.style.display = open ? "none" : "block";
    arrow.textContent = open ? "▾" : "▴";
  });
  document.getElementById("add-history-note").addEventListener("click", () => {
    const input = document.getElementById("new-history-note");
    const val = input.value.trim();
    if (!val) return;
    mutateCharacter(c.id, cur => pushHistoryEntry(cur, val));
  });

  // Mot de passe
  document.getElementById("manage-password").addEventListener("click", async () => {
    const cur = getCharacter(c.id);
    if (cur.passwordHash) {
      const choice = confirm("Cette fiche est protégée.\nOK = changer le mot de passe.\nAnnuler = proposer de le retirer.");
      if (choice) {
        const oldPw = prompt("Mot de passe actuel :");
        if (oldPw == null) return;
        const ok = await tryUnlockCharacter(cur, oldPw);
        if (!ok) { alert("Mot de passe incorrect."); return; }
        const newPw = prompt("Nouveau mot de passe :");
        if (!newPw) return;
        cur.passwordHash = await hashText(newPw);
        sessionUnlocked.add(cur.id);
        upsertCharacter(cur);
        toast("Mot de passe changé.", "success");
      } else {
        const oldPw = prompt("Mot de passe actuel (pour confirmer la suppression de la protection) :");
        if (oldPw == null) return;
        const ok = await tryUnlockCharacter(cur, oldPw);
        if (!ok) { alert("Mot de passe incorrect."); return; }
        cur.passwordHash = null;
        upsertCharacter(cur);
        toast("Protection retirée.", "success");
      }
    } else {
      const newPw = prompt("Choisissez un mot de passe pour protéger cette fiche :");
      if (!newPw) return;
      cur.passwordHash = await hashText(newPw);
      sessionUnlocked.add(cur.id);
      upsertCharacter(cur);
      toast("Fiche protégée.", "success");
    }
    renderCharacterSheet();
  });

  document.getElementById("export-json-btn").addEventListener("click", () => {
    saveCharacterFromForm(true);
    const cur = getCharacter(c.id);
    const blob = new Blob([JSON.stringify(cur, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = (cur.name || "personnage").replace(/[^a-z0-9]+/gi, "_") + ".json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  // Portrait
  document.getElementById("f-image").addEventListener("change", (e) => handleImageUpload(e, c.id));
  const removeBtn = document.getElementById("remove-image");
  if (removeBtn) removeBtn.addEventListener("click", () => {
    const cur = getCharacter(c.id);
    cur.image = null;
    upsertCharacter(cur);
    renderCharacterSheet();
  });

  // Talents
  document.getElementById("add-talent").addEventListener("click", () => {
    const select = document.getElementById("new-talent-select");
    if (!select.value) return;
    mutateCharacter(c.id, cur => cur.talents.push(select.value));
  });

  // Appliquer les suggestions d'Archétype
  document.getElementById("apply-archetype").addEventListener("click", () => {
    const archName = document.getElementById("f-archetype").value;
    const d = ARCHETYPE_DETAILS[archName];
    if (!d) { alert("Choisissez d'abord un Archétype dans la liste, ou aucune donnée détaillée n'est disponible pour celui-ci."); return; }
    if (!confirm(`Appliquer les valeurs suggérées de "${archName}" ? Cela va définir l'Espèce, les Attributs (si disponibles), et ajouter les Dons/Équipement suggérés à ce qui existe déjà.`)) return;
    mutateCharacter(c.id, cur => {
      cur.species = d.species;
      cur.motsCles = d.keywords;
      const faction = FACTIONS.find(f => f.archetypes && f.archetypes.some(a => a.name === archName));
      if (faction) cur.faction = faction.name;
      const attrKeys = ATTRIBUTES.filter(a => a.key !== "Spd").map(a => a.key);
      if (!d.attrs.some(v => v == null)) {
        attrKeys.forEach((k, i) => { cur.attributes[k] = d.attrs[i]; });
      }
      if (d.wargear && d.wargear !== "—") cur.equipment.push(d.wargear);
      if (d.talentsSuggested && d.talentsSuggested !== "—" && !d.talentsSuggested.startsWith("Voir")) {
        d.talentsSuggested.split(",").map(s => s.trim()).forEach(name => {
          const match = TALENTS.find(t => t.name === name);
          if (match && !cur.talents.includes(match.name)) cur.talents.push(match.name);
        });
      }
    });
  });

  // Armes
  document.getElementById("add-weapon").addEventListener("click", () => {
    const val = document.getElementById("new-weapon-select").value;
    if (!val) return;
    const [type, cat, idx] = val.split("|");
    const source = type === "melee" ? MELEE_WEAPONS : RANGED_WEAPONS;
    const w = source[cat][parseInt(idx, 10)];
    const snapshot = Object.assign({ type, reserve: "" }, w);
    mutateCharacter(c.id, cur => cur.weapons.push(snapshot));
  });
  document.getElementById("add-weapon-custom").addEventListener("click", () => {
    const input = document.getElementById("new-weapon-custom");
    const val = input.value.trim();
    if (!val) return;
    mutateCharacter(c.id, cur => cur.weapons.push({ name: val, type: "custom", dmg: "–", ed: "–", ap: "–", traits: "", reserve: "" }));
  });

  // Armure
  document.getElementById("add-armour").addEventListener("click", () => {
    const val = document.getElementById("new-armour-select").value;
    if (!val) return;
    const [cat, idx] = val.split("|");
    const a = ARMOUR[cat][parseInt(idx, 10)];
    mutateCharacter(c.id, cur => cur.armours.push(Object.assign({}, a)));
  });

  // Équipement général
  document.getElementById("add-equipment").addEventListener("click", () => {
    const input = document.getElementById("new-equipment");
    const val = input.value.trim();
    if (!val) return;
    mutateCharacter(c.id, cur => cur.equipment.push(val));
  });

  // Pouvoirs psychiques
  document.getElementById("add-psychic").addEventListener("click", () => {
    mutateCharacter(c.id, cur => cur.psychicPowers.push({ name: "", sd: "", activation: "", duree: "", portee: "", cible: "", effet: "" }));
  });
  document.getElementById("add-psychic-from-codex").addEventListener("click", () => {
    const val = document.getElementById("new-psychic-select").value;
    if (!val) return;
    const parts = val.split("|");
    let p;
    if (parts[0] === "ability") p = PSYKER_ABILITIES[parseInt(parts[1], 10)];
    else if (parts[0] === "minor") p = MINOR_PSYCHIC_POWERS[parseInt(parts[1], 10)];
    else p = PSYCHIC_DISCIPLINES[parts[1]][parseInt(parts[2], 10)];
    mutateCharacter(c.id, cur => cur.psychicPowers.push({
      name: p.name, sd: p.dn, activation: p.activation, duree: p.duration,
      portee: p.range, cible: p.multi || "", effet: p.effect
    }));
  });

  // Édition inline des lignes Pouvoirs Psychiques
  document.getElementById("psychic-table").addEventListener("change", (e) => {
    const idx = e.target.dataset.pidx;
    const field = e.target.dataset.pfield;
    if (idx === undefined || !field) return;
    mutateCharacter(c.id, cur => { cur.psychicPowers[idx][field] = e.target.value; }, false);
  });

  // Édition inline Réserve des armes
  document.getElementById("weapons-table").addEventListener("change", (e) => {
    const idx = e.target.dataset.widx;
    if (idx === undefined) return;
    mutateCharacter(c.id, cur => { cur.weapons[idx].reserve = e.target.value; }, false);
  });
}

// Applique une mutation au personnage en partant de l'état ACTUEL du
// formulaire (pas seulement de la dernière version enregistrée), pour ne
// jamais perdre une modification en cours (Attributs, Notes...) quand on
// clique sur "Ajouter" ou "Supprimer" sur une autre section de la fiche.
// rerender=false évite de perdre le focus d'un champ texte en cours de frappe.
function mutateCharacter(id, mutator, rerender = true) {
  const stored = getCharacter(id);
  const cur = document.getElementById("f-name") ? readFormAsCharacter(stored) : stored;
  const before = JSON.parse(JSON.stringify(cur));
  mutator(cur);
  if (rerender) {
    const diff = diffCharacters(before, cur);
    if (diff.length > 0) pushHistoryEntry(cur, "Mise à jour", diff);
  }
  upsertCharacter(cur);
  if (rerender) renderCharacterSheet();
}

function renderTalentList(talents) {
  if (!talents || talents.length === 0) return `<div class="note">Aucun don pour l'instant.</div>`;
  return talents.map((name, i) => {
    const t = TALENTS.find(t => t.name === name);
    return `<div class="talent-row">
      <div>
        <strong>${escapeHtml(name)}</strong>${t ? ` <span class="entry-tag">${t.xp} XP</span>` : ""}
        ${t && t.req ? `<div class="note">Prérequis : ${escapeHtml(t.req)}</div>` : ""}
        ${t ? `<div class="note">${escapeHtml(t.desc)}</div>` : ""}
      </div>
      <button class="btn btn-danger" data-del-field="talents" data-del-idx="${i}" type="button">&times;</button>
    </div>`;
  }).join("");
}

function renderWeaponRows(weapons) {
  if (!weapons || weapons.length === 0) return `<tr><td colspan="9" class="note">Aucune arme équipée.</td></tr>`;
  return weapons.map((w, i) => {
    const range = w.type === "ranged" ? `${w.short}/${w.med}/${w.long}` : (w.range || "–");
    return `<tr>
      <td>${escapeHtml(w.name)}</td>
      <td><input type="text" data-widx="${i}" value="${escapeHtml(w.reserve || "")}" style="width:4rem;"></td>
      <td>${w.dmg}</td>
      <td>${w.ed}</td>
      <td>${w.ap}</td>
      <td>${w.salvo != null ? w.salvo : "–"}</td>
      <td>${range}</td>
      <td>${w.traits || "–"}</td>
      <td>
        <button class="btn" data-calc-weapon="${i}" type="button" title="Utiliser dans la Calculatrice">🎲</button>
        <button class="btn btn-danger" data-del-field="weapons" data-del-idx="${i}" type="button">&times;</button>
      </td>
    </tr>`;
  }).join("");
}

function renderArmourRows(armours) {
  if (!armours || armours.length === 0) return `<tr><td colspan="4" class="note">Aucune armure équipée.</td></tr>`;
  return armours.map((a, i) => `<tr>
    <td>${escapeHtml(a.name)}</td>
    <td>${a.ar}</td>
    <td>${a.traits || "–"}</td>
    <td><button class="btn btn-danger" data-del-field="armours" data-del-idx="${i}" type="button">&times;</button></td>
  </tr>`).join("");
}

function renderPsychicRows(powers) {
  if (!powers || powers.length === 0) return `<tr><td colspan="8" class="note">Aucun pouvoir enregistré.</td></tr>`;
  const cols = ["name","sd","activation","duree","portee","cible","effet"];
  return powers.map((p, i) => `<tr>
    ${cols.map(col => `<td><input type="text" data-pidx="${i}" data-pfield="${col}" value="${escapeHtml(p[col] || "")}" style="width:${col === "effet" ? "12rem" : col === "name" ? "8rem" : "5rem"};"></td>`).join("")}
    <td><button class="btn btn-danger" data-del-field="psychicPowers" data-del-idx="${i}" type="button">&times;</button></td>
  </tr>`).join("");
}

function renderTagList(items, field) {
  if (!items || items.length === 0) return `<div class="note">Aucun élément pour l'instant.</div>`;
  return items.map((item, i) => `
    <span class="tag-chip">${escapeHtml(item)} <button data-del-field="${field}" data-del-idx="${i}" type="button">&times;</button></span>
  `).join("");
}

// ---------- Photo ----------

function handleImageUpload(e, charId) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    const img = new Image();
    img.onload = () => {
      const maxDim = 500;
      let w = img.width, h = img.height;
      if (w > h && w > maxDim) { h = Math.round(h * maxDim / w); w = maxDim; }
      else if (h > maxDim) { w = Math.round(w * maxDim / h); h = maxDim; }
      const canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      canvas.getContext("2d").drawImage(img, 0, 0, w, h);
      const dataUrl = canvas.toDataURL("image/jpeg", 0.82);
      const cur = getCharacter(charId);
      cur.image = dataUrl;
      upsertCharacter(cur);
      renderCharacterSheet();
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

// ---------- Sauvegarde du formulaire ----------

function readFormAsCharacter(base) {
  const c = Object.assign({}, base);
  c.playerName = val("f-playername");
  c.name = val("f-name") || "Sans nom";
  c.tier = intVal("f-tier", 1);
  c.rang = intVal("f-rang", 1);
  c.species = val("f-species");
  c.archetype = val("f-archetype");
  c.faction = val("f-faction");
  c.motsCles = val("f-motscles");
  c.historique = val("f-historique");
  c.xpTotal = intVal("f-xptotal", 0);
  c.wounds = intVal("f-wounds", 0);
  c.shock = intVal("f-shock", 0);
  c.corruption = intVal("f-corruption", 0);
  c.fureur = intVal("f-fureur", 0);
  c.gloire = intVal("f-gloire", 0);
  c.richesseBonus = intVal("f-richessebonus", 0);
  c.foiMax = intVal("f-foimax", 0);
  c.foiCurrent = intVal("f-foicurrent", 0);
  c.blessuresGuerre = val("f-blessuresguerre");
  c.mutations = val("f-mutations");
  c.cadreCampagne = val("f-cadre");
  c.bonusCadreCampagne = val("f-cadrebonus");
  c.notes = val("f-notes");

  c.attributes = {};
  document.querySelectorAll("input[data-attr]").forEach(inp => {
    c.attributes[inp.dataset.attr] = parseInt(inp.value, 10) || 1;
  });
  c.skills = {};
  document.querySelectorAll("input[data-skill]").forEach(inp => {
    c.skills[inp.dataset.skill] = parseInt(inp.value, 10) || 0;
  });
  c.blessuresGraves = [];
  document.querySelectorAll("input[data-grave]").forEach(inp => {
    c.blessuresGraves[parseInt(inp.dataset.grave, 10)] = inp.value;
  });

  return c;
}

function val(id) {
  const el = document.getElementById(id);
  return el ? el.value : "";
}
function intVal(id, fallback) {
  const el = document.getElementById(id);
  const n = el ? parseInt(el.value, 10) : NaN;
  return isNaN(n) ? fallback : n;
}

function saveCharacterFromForm(silent) {
  const base = getCharacter(state.characterId);
  const updated = readFormAsCharacter(base);
  const diff = diffCharacters(base, updated);
  if (diff.length > 0) {
    pushHistoryEntry(updated, silent ? "Mise à jour" : "Sauvegarde manuelle", diff);
  }
  upsertCharacter(updated);
  if (!silent) switchTab("list");
}

// ---------- Vue : Codex ----------

function renderCodex() {
  const container = document.getElementById("codex-content");
  document.querySelectorAll(".subtab-btn").forEach(b => b.classList.toggle("active", b.dataset.codex === state.codexTab));

  if (state.codexTab === "attributs") {
    container.innerHTML = ATTRIBUTES.map(a => `
      <div class="codex-entry">
        <span class="entry-name">${a.name}</span><span class="entry-tag">${a.key}</span>
        <div class="entry-desc">${a.desc}</div>
      </div>
    `).join("");
  }

  if (state.codexTab === "competences") {
    container.innerHTML = SKILLS.map(s => `
      <div class="codex-entry">
        <span class="entry-name">${s.name}</span><span class="entry-tag">${s.attr}</span>
        <div class="entry-desc">${s.desc}</div>
      </div>
    `).join("");
  }

  if (state.codexTab === "especes") {
    container.innerHTML = SPECIES.map(s => `
      <div class="codex-entry">
        <span class="entry-name">${s.name}</span><span class="entry-tag">${s.xpCost} XP · Vitesse ${s.speed} · Taille ${s.size}</span>
        <div class="entry-desc">${s.abilities.length ? s.abilities.join("<br>") : "Aucun trait particulier — plus de points d'expérience à répartir librement."}</div>
      </div>
    `).join("");
  }

  if (state.codexTab === "archetypes") {
    const byTier = [1,2,3,4].map(t => `
      <h3 class="codex-subhead">PALIER ${t}</h3>
      ${ARCHETYPES.filter(a => a.tier === t).map(a => {
        const d = ARCHETYPE_DETAILS[a.name];
        if (!d) return `<div class="codex-entry"><span class="entry-name">${a.name}</span><span class="entry-tag">p.${a.page}</span></div>`;
        const attrLabels = ATTRIBUTES.filter(x => x.key !== "Spd").map(x => x.key);
        const attrLine = d.attrs.some(v => v == null) ? "Voir bonus d'Espèce" : attrLabels.map((k,i) => `${k} ${d.attrs[i]}`).join(" · ");
        return `<div class="codex-entry">
          <span class="entry-name">${a.name}</span><span class="entry-tag">${d.species} · ${d.xpCost} XP</span>
          <div class="entry-desc"><em>Mots-clés :</em> ${d.keywords}</div>
          <div class="entry-desc"><strong>${d.abilityName}</strong> — ${d.abilityText}</div>
          <div class="entry-desc"><em>Attributs suggérés :</em> ${attrLine}</div>
          <div class="entry-desc"><em>Compétences suggérées :</em> ${d.skillsSuggested}</div>
          <div class="entry-desc"><em>Dons suggérés :</em> ${d.talentsSuggested}</div>
          <div class="entry-desc"><em>Équipement :</em> ${d.wargear}</div>
        </div>`;
      }).join("")}
    `).join("");
    container.innerHTML = byTier;
  }

  if (state.codexTab === "dons") {
    const q = (document.getElementById("codex-search").value || "").toLowerCase();
    const filtered = TALENTS.filter(t => t.name.toLowerCase().includes(q) || t.desc.toLowerCase().includes(q));
    container.innerHTML = filtered.map(t => `
      <div class="codex-entry">
        <span class="entry-name">${t.name}</span><span class="entry-tag">${t.xp} XP</span>
        ${t.req ? `<div class="entry-desc"><em>Prérequis :</em> ${t.req}</div>` : ""}
        <div class="entry-desc">${t.desc}</div>
      </div>
    `).join("") || `<p class="note">Aucun don ne correspond à « ${escapeHtml(q)} ».</p>`;
  }

  if (state.codexTab === "armurerie") {
    const q = (document.getElementById("codex-search").value || "").toLowerCase();
    let html = "";
    html += `<h3 class="codex-subhead">ARMES DE MÊLÉE</h3>`;
    Object.entries(MELEE_WEAPONS).forEach(([cat, items]) => {
      const filtered = items.filter(w => w.name.toLowerCase().includes(q));
      if (filtered.length === 0) return;
      html += renderMeleeTable(cat, filtered);
    });
    html += `<h3 class="codex-subhead">ARMES À DISTANCE</h3>`;
    Object.entries(RANGED_WEAPONS).forEach(([cat, items]) => {
      const filtered = items.filter(w => w.name.toLowerCase().includes(q));
      if (filtered.length === 0) return;
      html += renderRangedTable(cat, filtered);
    });
    html += `<h3 class="codex-subhead">ARMURES</h3>`;
    Object.entries(ARMOUR).forEach(([cat, items]) => {
      const filtered = items.filter(a => a.name.toLowerCase().includes(q));
      if (filtered.length === 0) return;
      html += renderArmourTable(cat, filtered);
    });
    if (!q) {
      html += `<h3 class="codex-subhead">TRAITS D'ARMES</h3>`;
      html += WEAPON_TRAITS.map(t => `<div class="codex-entry"><span class="entry-name">${t.name}</span><div class="entry-desc">${t.desc}</div></div>`).join("");
    }
    container.innerHTML = html;
  }

  if (state.codexTab === "psychique") {
    const q = (document.getElementById("codex-search").value || "").toLowerCase();
    let html = "";
    if (!q) {
      html += `<h3 class="codex-subhead">APTITUDES UNIVERSELLES (gratuites, tout PSYKER)</h3>`;
      html += PSYKER_ABILITIES.map(p => renderPowerEntry(p, true)).join("");
      html += `<h3 class="codex-subhead">POUVOIRS MINEURS</h3>`;
      html += MINOR_PSYCHIC_POWERS.filter(p => p.name.toLowerCase().includes(q)).map(p => renderPowerEntry(p)).join("");
    }
    Object.entries(PSYCHIC_DISCIPLINES).forEach(([disc, powers]) => {
      const filtered = powers.filter(p => p.name.toLowerCase().includes(q));
      if (filtered.length === 0) return;
      html += `<h3 class="codex-subhead">${disc.toUpperCase()}</h3>`;
      html += filtered.map(p => renderPowerEntry(p)).join("");
    });
    if (q) {
      const minorFiltered = MINOR_PSYCHIC_POWERS.filter(p => p.name.toLowerCase().includes(q));
      if (minorFiltered.length) html = `<h3 class="codex-subhead">POUVOIRS MINEURS</h3>` + minorFiltered.map(p => renderPowerEntry(p)).join("") + html;
    }
    container.innerHTML = html || `<p class="note">Aucun pouvoir ne correspond à « ${escapeHtml(q)} ».</p>`;
  }

  if (state.codexTab === "factions") {
    container.innerHTML = FACTIONS.map(f => `
      <div class="codex-entry">
        <span class="entry-name">${f.name}</span><span class="entry-tag">${f.keywords}</span>
        <div class="entry-desc">${f.overview}</div>
        ${f.placeholderNote ? `<div class="entry-desc"><em>${f.placeholderNote}</em></div>` : ""}
        ${f.archetypes && f.archetypes.length ? `<div class="entry-desc"><em>Archétypes :</em> ${f.archetypes.map(a => `${a.name} (Palier ${a.tier})`).join(", ")}</div>` : ""}
      </div>
    `).join("");
  }

  if (state.codexTab === "mutations") {
    const q = (document.getElementById("codex-search").value || "").toLowerCase();
    let html = `<p class="note">Test de Mutation : Conviction contre DD 3 (+ Niveau de Corruption). En cas d'échec, jet de sévérité 1d6 (1-2 Subtile, 3-4 Mineure, 5-6 Sévère) puis d66 sur la table (+10 par mutation déjà possédée).</p>`;
    Object.entries(MUTATIONS).forEach(([severity, list]) => {
      const filtered = list.filter(m => m.name.toLowerCase().includes(q));
      if (filtered.length === 0) return;
      html += `<h3 class="codex-subhead">${severity.toUpperCase()}</h3>`;
      html += filtered.map(m => `
        <div class="codex-entry">
          <span class="entry-name">${m.name}</span><span class="entry-tag">d66 : ${m.roll}</span>
          <div class="entry-desc">${m.effect}</div>
        </div>
      `).join("");
    });
    if (!q) {
      html += `<h3 class="codex-subhead">MUTATIONS SCAVVY</h3><p class="entry-desc">${SCAVVY_MUTATIONS.join(", ")}</p>`;
    }
    container.innerHTML = html;
  }
}

function renderPowerEntry(p, isAbility) {
  return `<div class="codex-entry">
    <span class="entry-name">${p.name}</span><span class="entry-tag">${isAbility ? "Gratuit" : (p.xp + " XP")} · DD ${p.dn}</span>
    <div class="entry-desc"><em>${p.activation} · ${p.duration} · Portée ${p.range}${p.multi ? " · Multi-cible: " + p.multi : ""}</em></div>
    <div class="entry-desc">${p.effect}</div>
  </div>`;
}

function renderMeleeTable(cat, items) {
  const rows = items.map(w => `<tr><td>${w.name}</td><td>${w.dmg}</td><td>${w.ed}</td><td>${w.ap}</td><td>${w.range}</td><td>${w.traits || "–"}</td><td>${w.value}</td><td>${w.rarity}</td></tr>`).join("");
  return `<div class="table-wrap"><div class="note">${cat}</div>
    <table class="codex-table"><thead><tr><th>Nom</th><th>Dégâts</th><th>DS</th><th>PA</th><th>Portée</th><th>Traits</th><th>Val.</th><th>Rareté</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

function renderRangedTable(cat, items) {
  const rows = items.map(w => `<tr><td>${w.name}</td><td>${w.dmg}</td><td>${w.ed}</td><td>${w.ap}</td><td>${w.short}/${w.med}/${w.long}</td><td>${w.salvo}</td><td>${w.traits || "–"}</td><td>${w.value}</td><td>${w.rarity}</td></tr>`).join("");
  return `<div class="table-wrap"><div class="note">${cat}</div>
    <table class="codex-table"><thead><tr><th>Nom</th><th>Dégâts</th><th>DS</th><th>PA</th><th>Portée</th><th>Salve</th><th>Traits</th><th>Val.</th><th>Rareté</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

function renderArmourTable(cat, items) {
  const rows = items.map(a => `<tr><td>${a.name}</td><td>${a.ar}</td><td>${a.traits}</td><td>${a.value}</td><td>${a.rarity}</td></tr>`).join("");
  return `<div class="table-wrap"><div class="note">${cat}</div>
    <table class="codex-table"><thead><tr><th>Nom</th><th>AR</th><th>Traits</th><th>Val.</th><th>Rareté</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

function switchCodexTab(tab) {
  state.codexTab = tab;
  renderCodex();
}

// ---------- Vue : Fiche imprimable ----------

function openPrintSheet(id) {
  state.characterId = id;
  switchTab("print");
  renderPrintSheet();
}

function renderPrintSheet() {
  const c = getCharacter(state.characterId);
  if (!c) { switchTab("list"); return; }
  const d = computeDerived(c);

  const attrRow = (label) => ATTRIBUTES.filter(a => a.key !== "Spd").map(a => {
    const score = (c.attributes && c.attributes[a.key]) || 1;
    const species = getSpecies(c.species);
    const bonus = (species.attrBonus && species.attrBonus[a.key]) || 0;
    const total = score + bonus;
    if (label === "score") return `<td>${score}</td>`;
    if (label === "bonus") return `<td>${bonus}</td>`;
    return `<td><strong>${total}</strong></td>`;
  }).join("");

  const skillLeft = SKILLS.slice(0, 9);
  const skillRight = SKILLS.slice(9);
  const skillRow = (s) => `<tr><td>${s.name} <small>(${s.attr})</small></td><td>${(c.skills && c.skills[s.name]) || 0}</td><td><strong>${skillTotal(c, s.name)}</strong></td></tr>`;

  const weaponsRows = (c.weapons || []).map(w => {
    const range = w.type === "ranged" ? `${w.short}/${w.med}/${w.long}` : (w.range || "–");
    return `<tr><td>${escapeHtml(w.name)}</td><td>${escapeHtml(w.reserve || "")}</td><td>${w.dmg}</td><td>${w.ed}</td><td>${w.ap}</td><td>${w.salvo != null ? w.salvo : "–"}</td><td>${range}</td><td>${w.traits || "–"}</td></tr>`;
  }).join("") || `<tr><td colspan="8">—</td></tr>`;

  const armourRows = (c.armours || []).map(a => `<tr><td>${escapeHtml(a.name)}</td><td>${a.ar}</td><td>${a.traits || "–"}</td></tr>`).join("") || `<tr><td colspan="3">—</td></tr>`;

  const psychicRows = (c.psychicPowers || []).filter(p => p.name).map(p =>

          <h1>${escapeHtml(c.name)}</h1>
          <div>Joueur : ${escapeHtml(c.playerName || "—")}</div>
          <div>Tier : ${c.tier} &nbsp; Rang : ${c.rang || 1} &nbsp; Espèce : ${escapeHtml(c.species)} &nbsp; Archétype : ${escapeHtml(c.archetype || "—")}</div>
          <div>Faction : ${escapeHtml(c.faction || "—")} &nbsp; Mots-Clés : ${escapeHtml(c.motsCles || "—")}</div>

      <div class="pt-grid-2">
        <div>
          <h2>Attributs</h2>
          <table class="pt-table">
            <thead><tr><th></th>${ATTRIBUTES.filter(a=>a.key!=="Spd").map(a=>`<th>${a.key}</th>`).join("")}</tr></thead>
            <tbody>
              <tr><td>Score</td>${attrRow("score")}</tr>

          <table class="pt-table pt-derived">
            <tbody>

              <tr><td>Stress Max</td><td>${d.stressMax}</td><td>Actuel</td><td>${c.shock || 0}</td></tr>

// ---------- Utilitaires ----------

function resolveWeaponDamage(c, w) {
  const raw = String(w.dmg == null ? "" : w.dmg);
  // Format mêlée : "(F) +N" -> Total de Force + N
  const meleeMatch = raw.match(/\(([A-Za-z]+)\)\s*\+?(-?\d+)/);
  if (meleeMatch) {
    const attrLetter = meleeMatch[1].toUpperCase();
    const flat = parseInt(meleeMatch[2], 10) || 0;
    const attrKeyMap = { F: "F", E: "E", A: "A", I: "I", FM: "FM", INT: "Int", SOC: "Soc" };
    const key = attrKeyMap[attrLetter] || "F";
    return attributeTotal(c, key) + flat;
  }
  // Format à distance : nombre simple, éventuellement avec du texte autour
  const n = parseInt(raw.replace(/[^0-9-]/g, ""), 10);
  return isNaN(n) ? 0 : n;
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str == null ? "" : String(str);
  return div.innerHTML;
}

function renderMissionEditorList(missions) {
  if (!missions || missions.length === 0) return `<p class="note">Aucune mission pour l'instant.</p>`;
  return missions.map(m => `
    <div class="mission-editor-row">
      <input type="text" data-mission-id="${m.id}" data-mission-field="title" value="${escapeHtml(m.title)}" placeholder="Titre">
      <select data-mission-id="${m.id}" data-mission-field="status">

        <option value="active" ${m.status === "active" ? "selected" : ""}>Active</option>
        <option value="terminee" ${m.status === "terminee" ? "selected" : ""}>Terminée</option>
      </select>
      <button class="btn btn-danger" data-mission-delete="${m.id}" type="button">&times;</button>
      <textarea data-mission-id="${m.id}" data-mission-field="description" rows="2" placeholder="Description...">${escapeHtml(m.description || "")}</textarea>

function renderMissionPollResults(missions, characters) {

function renderRecapEditorList(recaps) {

function bindPasswordToggle(toggleId, inputId) {
  const toggle = document.getElementById(toggleId);
  const input = document.getElementById(inputId);
  if (!toggle || !input) return;
  toggle.addEventListener("click", () => {
    const showing = input.type === "text";
    input.type = showing ? "password" : "text";
    toggle.classList.toggle("seal-toggle-active", !showing);
  });
}

function renderSessionEditorList(sessions) {
  if (!sessions || sessions.length === 0) return `<p class="note">Aucune session programmée.</p>`;

function renderCampaignBanner() {
  const el = document.getElementById("campaign-banner");
  const campaign = loadCampaign();
  const hasContent = campaign.campaignName || campaign.announcement || (campaign.missions || []).length > 0;

  if (!hasContent) {
    el.innerHTML = `
      <div class="campaign-banner-empty">
        <span>Aucune campagne importée pour l'instant.</span>
        <button class="btn" id="banner-import-campaign" type="button">Importer une Campagne (JSON du MJ)</button>
        <input type="file" id="banner-campaign-file" accept=".json" style="display:none;">
      </div>`;
    document.getElementById("banner-import-campaign").addEventListener("click", () => document.getElementById("banner-campaign-file").click());
    document.getElementById("banner-campaign-file").addEventListener("change", (e) => {
      if (e.target.files[0]) importCampaignFile(e.target.files[0]);
      e.target.value = "";
    });
    return;
  }

  const activeChar = state.characterId ? getCharacter(state.characterId) : null;
  const missionsHtml = (campaign.missions || []).map(m => {
    const chosen = activeChar && activeChar.missionChoice === m.id;
    return `<div class="mission-card mission-${m.status}">
      <div class="mission-title">${escapeHtml(m.title)} <span class="mission-status">${missionStatusLabel(m.status)}</span></div>
      ${m.description ? `<div class="mission-desc">${escapeHtml(m.description).replace(/\n/g, "<br>")}</div>` : ""}
      ${m.status === "proposee" && activeChar ? `<button class="btn ${chosen ? "btn-primary" : ""}" data-choose-mission="${m.id}" type="button">${chosen ? "✓ Choisie" : "Choisir cette mission"}</button>` : ""}
    </div>`;
  }).join("");

  el.innerHTML = `
    <div class="campaign-panel">
      <div class="campaign-header" id="campaign-toggle">
        <strong>${escapeHtml(campaign.campaignName || "Campagne")}</strong>
        <span class="campaign-arrow">▾</span>
      </div>
      <div class="campaign-body" id="campaign-body">
        ${campaign.announcement ? `<div class="campaign-announcement">📜 ${escapeHtml(campaign.announcement)}</div>` : ""}
        ${missionsHtml ? `<div class="mission-list">${missionsHtml}</div>` : ""}
        ${!activeChar && (campaign.missions || []).some(m => m.status === "proposee") ? `<p class="note">Ouvrez une fiche personnage pour indiquer votre choix de mission.</p>` : ""}
        ${(campaign.sessionRecaps || []).length ? renderSessionRecapsPreview(campaign.sessionRecaps) : ""}
        <div class="btn-row" style="margin-top:0.5rem;">
          <button class="btn" id="banner-reimport-campaign" type="button">Mettre à jour (réimporter)</button>
          <input type="file" id="banner-campaign-file2" accept=".json" style="display:none;">
        </div>
      </div>
    </div>`;

  document.getElementById("campaign-toggle").addEventListener("click", () => {
    const body = document.getElementById("campaign-body");
    const arrow = document.querySelector(".campaign-arrow");
    const open = body.style.display !== "none";
    body.style.display = open ? "none" : "block";
    arrow.textContent = open ? "▾" : "▴";
  });
  document.getElementById("banner-reimport-campaign").addEventListener("click", () => document.getElementById("banner-campaign-file2").click());
  document.getElementById("banner-campaign-file2").addEventListener("change", (e) => {
    if (e.target.files[0]) importCampaignFile(e.target.files[0]);
    e.target.value = "";
  });
  el.querySelectorAll("[data-choose-mission]").forEach(btn => {
    btn.addEventListener("click", () => {
      if (!state.characterId) return;
      mutateCharacter(state.characterId, cur => {
        cur.missionChoice = btn.dataset.chooseMission;
        const m = campaign.missions.find(x => x.id === cur.missionChoice);
        pushHistoryEntry(cur, "Mission choisie : " + (m ? m.title : "?"));
      }, false);
      renderCampaignBanner();
      if (state.view === "sheet") renderCharacterSheet();
    });
  });
}

      ${sorted.map(r => `
        <div class="recap-card">
          <div class="recap-title">${escapeHtml(r.title)} <span class="mission-status">${r.date}</span></div>
          <div class="recap-text">${escapeHtml(r.text).replace(/\n/g, "<br>")}</div>
        </div>
      `).join("")}
    </div>`;
}

function missionStatusLabel(status) {
  if (status === "active") return "★ En cours";
  if (status === "terminee") return "Terminée";
  return "Proposée";
}

function importCampaignFile(file) {
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const imported = JSON.parse(e.target.result);
      if (!("missions" in imported)) throw new Error("Ce fichier ne semble pas être une campagne valide.");
      saveCampaign(Object.assign(createBlankCampaign(), imported));
      renderCampaignBanner();
      toast("Campagne mise à jour.", "success");
    } catch (err) {
      toast("Impossible d'importer ce fichier : " + err.message, "error");
    }
  };
  reader.readAsText(file);
}

// ---------- Initialisation ----------

document.addEventListener("DOMContentLoaded", () => {
  initGroupGate();

  document.querySelectorAll(".tab-btn").forEach(btn => {
    btn.addEventListener("click", () => switchTab(btn.dataset.view));
  });

  // Délégation de suppression liée une seule fois sur le conteneur persistant
  // (sheet-content survit aux ré-affichages ; seul son innerHTML change),
  // pour éviter d'empiler des écouteurs à chaque rendu.
  document.getElementById("sheet-content").addEventListener("click", (e) => {
    const delBtn = e.target.closest("[data-del-field]");
    if (delBtn && state.characterId) {
      const field = delBtn.dataset.delField;
      const idx = parseInt(delBtn.dataset.delIdx, 10);
      mutateCharacter(state.characterId, cur => { cur[field].splice(idx, 1); });
      return;
    }
    const calcBtn = e.target.closest("[data-calc-weapon]");
    if (calcBtn && state.characterId) {
      const idx = parseInt(calcBtn.dataset.calcWeapon, 10);
      const cur = getCharacter(state.characterId);
      const w = cur.weapons[idx];
      if (w) {
        calcState.attackPool = w.type === "ranged" ? skillTotal(cur, "Capacité de Tir") : skillTotal(cur, "Capacité de Combat");
        calcState.weaponDamage = resolveWeaponDamage(cur, w);
        calcState.weaponED = parseInt(w.ed, 10) || 0;
        calcState.weaponAP = parseInt(String(w.ap).replace(/[^0-9-]/g, ""), 10) || 0;
        calcState.brutal = /brutal/i.test(w.traits || "");
        calcState.melta = /(melta|fusion)/i.test(w.traits || "");
        calcState.lastHitRoll = null;
        calcState.lastDamageRoll = null;
        switchTab("calc");
      }
    }
  });
  document.querySelectorAll(".subtab-btn").forEach(btn => {
    btn.addEventListener("click", () => switchCodexTab(btn.dataset.codex));
  });
  document.getElementById("new-char-btn").addEventListener("click", newCharacter);
  document.getElementById("codex-search").addEventListener("input", renderCodex);
  document.getElementById("print-back").addEventListener("click", () => openCharacterSheet(state.characterId));
  document.getElementById("print-now").addEventListener("click", () => window.print());

  if (getGroupId()) {
    migrateOldCharacterMessages();
    switchTab("tutoriel");
    initFirebaseSync();
  }
});

// ---------- Portail de Groupe ----------
// Tant qu'aucun Groupe/Table n'est choisi, seul cet écran est visible.
// Une fois un groupe rejoint, la page se recharge simplement : toutes
// les clés de stockage et les chemins Firestore en dépendent, un
// rechargement propre évite d'avoir à tout ré-initialiser à la main.

function initGroupGate() {
  const existing = getGroupId();
  if (existing) {
    document.getElementById("group-gate").style.display = "none";
    document.getElementById("app-shell").classList.remove("app-shell-hidden");
  } else {
    document.getElementById("group-gate").style.display = "flex";
    document.getElementById("app-shell").classList.add("app-shell-hidden");

    connectFirebaseApp();
    fetchGroupRegistry(renderGroupList);
  }

  document.getElementById("group-gate-submit").addEventListener("click", submitGroupGate);
  document.getElementById("group-gate-password").addEventListener("keydown", (e) => {
    if (e.key === "Enter") submitGroupGate();
  });
  bindPasswordToggle("group-password-toggle", "group-gate-password");

  document.getElementById("change-group-btn").addEventListener("click", () => {
    if (!confirm("Changer de groupe ? Vous reviendrez sur cet écran pour en rejoindre un autre (vos données restent sauvegardées, vous pourrez revenir).")) return;
    leaveGroup();
    location.reload();
  });
}

let knownGroups = [];

function renderGroupList(groups) {
  knownGroups = groups || [];
  const container = document.getElementById("group-list");
  if (!groups || groups.length === 0) {
    container.innerHTML = `<p class="note">Aucun groupe existant pour l'instant — créez le premier ci-dessous.</p>`;
    return;
  }
  container.innerHTML = groups.map(g => `
    <div class="group-list-row">
      <button class="group-list-btn" data-join-group="${escapeHtml(g.id)}" data-join-group-name="${escapeHtml(g.name)}" type="button">
        <span>${escapeHtml(g.name)}</span><span class="group-list-arrow">→</span>
      </button>
      <button class="group-list-delete" data-delete-group="${escapeHtml(g.id)}" data-delete-group-name="${escapeHtml(g.name)}" type="button" title="Supprimer ce groupe">🗑</button>
    </div>
  `).join("");
  container.querySelectorAll("[data-join-group]").forEach(btn => {
    btn.addEventListener("click", () => {
      setGroupId(btn.dataset.joinGroup, btn.dataset.joinGroupName);
      location.reload();
    });
  });
  container.querySelectorAll("[data-delete-group]").forEach(btn => {
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      promptDeleteGroup(btn.dataset.deleteGroup, btn.dataset.deleteGroupName);
    });
  });
}

function promptDeleteGroup(groupId, groupName) {
  const pw = prompt(`Supprimer définitivement le groupe "${groupName}" ?\nToutes ses fiches, sa campagne et ses messages seront perdus, pour tout le monde.\n\nMot de passe de suppression :`);
  if (pw == null) return;
  if (pw !== CREATE_GROUP_PASSWORD) {
    toast("Mot de passe incorrect.", "error");
    return;
  }
  if (!confirm(`Dernière confirmation : supprimer "${groupName}" définitivement ?`)) return;
  deleteGroupCompletely(groupId, (err) => {
    if (err) {
      toast("Échec de la suppression : " + err.message, "error");
      return;
    }
    clearLocalGroupCache(groupId);
    toast(`Groupe "${groupName}" supprimé.`, "success");
    fetchGroupRegistry(renderGroupList);
  });
}

function submitGroupGate() {
  const nameInput = document.getElementById("group-gate-input");
  const pwInput = document.getElementById("group-gate-password");
  const rawName = nameInput.value.trim();
  if (!rawName) {
    toast("Entrez un nom de groupe.", "error");
    nameInput.focus();
    return;
  }
  const id = normalizeGroupId(rawName);
  if (!id) {
    toast("Nom de groupe invalide.", "error");
    return;
  }

  const existingGroup = knownGroups.find(g => g.id === id);
  if (existingGroup) {
    // Groupe déjà connu : pas besoin de mot de passe, c'est une jonction.
    setGroupId(existingGroup.name);
    location.reload();
    return;
  }

  // Nom inconnu du registre : c'est une création, mot de passe requis.
  if (pwInput.value !== CREATE_GROUP_PASSWORD) {
    const field = document.getElementById("group-password-field");
    field.classList.add("seal-shake");
    setTimeout(() => field.classList.remove("seal-shake"), 400);
    toast("Ce groupe n'existe pas encore. Le mot de passe de création est requis (ou incorrect).", "error");
    pwInput.focus();
    return;
  }
  registerGroupInRegistry(id, rawName);
  setGroupId(rawName);
  location.reload();
}


</script>
