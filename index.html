// ============================================================
// SYNCHRONISATION FIREBASE (Firestore) — temps réel entre navigateurs.
//
// Toutes les données (personnages, campagne, messages) sont rangées
// sous groups/{groupId}/... — chaque Groupe/Table (donc chaque MJ) a
// ainsi ses propres données, complètement isolées des autres groupes,
// dans la même base Firestore.
//
// Fonctionnement :
//  - Le localStorage reste la mémoire "rapide" locale (elle aussi
//    préfixée par groupe, voir storage.js) ; l'app continue de
//    fonctionner exactement pareil, même hors ligne.
//  - Toute écriture locale (upsertCharacter, saveCampaign) est aussi
//    envoyée à Firestore en tâche de fond (sans bloquer l'interface).
//  - Des écouteurs temps réel (onSnapshot) reçoivent les changements
//    faits par d'autres navigateurs DU MÊME GROUPE et les répercutent
//    localement.
//  - Si Firebase est indisponible (pas de connexion, bloqueur de pub,
//    configuration absente...), tout ceci est ignoré silencieusement :
//    le site continue de fonctionner en local uniquement.
//
// Sécurité : ce projet utilise les règles Firestore en "mode test"
// (lecture/écriture ouvertes). C'est adapté à des groupes d'amis, mais
// n'importe qui connaissant l'URL du projet ET l'identifiant d'un
// groupe pourrait techniquement lire/modifier ses données en
// contournant le site. Les mots de passe de fiches et le mot de passe
// Admin restent une protection au niveau de l'interface, pas une
// sécurité absolue. Choisissez des identifiants de groupe peu devinables.
// ============================================================

const firebaseConfig = {
  apiKey: "AIzaSyCgss4TruoeLsS7cg0gZTGI88Q4Ftk1Ds0",
  authDomain: "wrath-glory-gilead.firebaseapp.com",
  projectId: "wrath-glory-gilead",
  storageBucket: "wrath-glory-gilead.firebasestorage.app",
  messagingSenderId: "755636203867",
  appId: "1:755636203867:web:668c5c1c22cf1848d4aa7e"
};

let fbDb = null;
let firebaseSyncStatus = "init"; // init | connected | error | disabled

function stripUndefined(obj) {
  // Firestore refuse les valeurs "undefined" ; ce détour JSON les enlève proprement.
  return JSON.parse(JSON.stringify(obj));
}

// Racine Firestore du groupe actif : groups/{groupId}/{collectionName}
function groupCollection(name) {
  const groupId = getGroupId();
  return fbDb.collection("groups").doc(groupId).collection(name);
}

// ---------- Connexion Firebase indépendante du groupe (pour le portail) ----------

function connectFirebaseApp() {
  if (typeof firebase === "undefined") {
    firebaseSyncStatus = "disabled";
    return false;
  }
  try {
    if (!firebase.apps || firebase.apps.length === 0) firebase.initializeApp(firebaseConfig);
    fbDb = firebase.firestore();
    return true;
  } catch (e) {
    console.warn("Impossible d'initialiser Firebase :", e);
    firebaseSyncStatus = "error";
    return false;
  }
}

// Liste des groupes déjà créés (registre global, hors de tout groupe).
function fetchGroupRegistry(callback) {
  if (!fbDb) { callback([]); return; }
  fbDb.collection("groupRegistry").orderBy("name").get()
    .then(snapshot => callback(snapshot.docs.map(d => d.data())))
    .catch(e => { console.warn("Lecture du registre de groupes échouée :", e); callback([]); });
}

function registerGroupInRegistry(groupId, displayName) {
  if (!fbDb) return;
  const ref = fbDb.collection("groupRegistry").doc(groupId);
  ref.get().then(doc => {
    if (doc.exists) return; // ne jamais écraser un nom déjà enregistré
    ref.set({ id: groupId, name: displayName, createdAt: new Date().toISOString() });
  }).catch(e => console.warn("Enregistrement du groupe échoué :", e));
}

// Renomme un groupe existant dans le registre (nom affiché uniquement —
// l'identifiant technique et le chemin Firestore des données ne changent
// pas). callback(error) — error est null/undefined en cas de succès.
function renameGroupInRegistry(groupId, newName, callback) {
  if (!fbDb) { callback && callback(new Error("Firebase indisponible.")); return; }
  fbDb.collection("groupRegistry").doc(groupId).set(
    { id: groupId, name: newName },
    { merge: true }
  )
    .then(() => callback && callback(null))
    .catch(e => {
      console.warn("Renommage du groupe échoué :", e);
      callback && callback(e);
    });
}

// Supprime complètement un groupe : toutes ses données (personnages,
// campagne, messages) ainsi que son entrée dans le registre. Irréversible.
function deleteGroupCompletely(groupId, callback) {
  if (!fbDb) { if (callback) callback(new Error("Firebase indisponible.")); return; }
  const subCollections = ["characters", "campaign", "messages"];
  const deletions = subCollections.map(name =>
    fbDb.collection("groups").doc(groupId).collection(name).get().then(snapshot => {
      if (snapshot.empty) return null;
      const batch = fbDb.batch();
      snapshot.docs.forEach(d => batch.delete(d.ref));
      return batch.commit();
    })
  );
  Promise.all(deletions)
    .then(() => fbDb.collection("groupRegistry").doc(groupId).delete())
    .then(() => {
      // Nettoyage du cache local si ce navigateur avait déjà utilisé ce groupe
      ["wg_characters_v3", "wg_campaign_v1", "wg_messages_v1"].forEach(base => {
        localStorage.removeItem(base + "_" + groupId);
      });
      if (callback) callback();
    })
    .catch(e => {
      console.warn("Suppression du groupe échouée :", e);
      if (callback) callback(e);
    });
}

function mergeCharacterLists(local, remote) {
  const map = new Map();
  local.forEach(c => map.set(c.id, c));
  remote.forEach(rc => {
    const lc = map.get(rc.id);
    if (!lc || new Date(rc.updatedAt || 0) >= new Date(lc.updatedAt || 0)) {
      map.set(rc.id, rc);
    }
  });
  return Array.from(map.values());
}

function initFirebaseSync() {
  if (!getGroupId()) {
    firebaseSyncStatus = "disabled";
    return; // pas de groupe choisi : rien à synchroniser pour l'instant
  }
  if (!fbDb) {
    const ok = connectFirebaseApp();
    if (!ok) {
      console.info("Firebase indisponible — mode local uniquement.");
      updateSyncStatusBadge();
      return;
    }
  }
  firebaseSyncStatus = "connected";
  updateSyncStatusBadge();
  registerGroupInRegistry(getGroupId(), getGroupId()); // rétro-inscription si créé avant cette fonctionnalité

  // ---------- Écriture (locale -> Firestore) ----------
  firestoreSaveCharacter = function (character) {
    if (!fbDb) return;
    groupCollection("characters").doc(character.id).set(stripUndefined(character))
      .catch(e => console.warn("Synchronisation (personnage) échouée :", e));
  };
  firestoreDeleteCharacterRemote = function (id) {
    if (!fbDb) return;
    groupCollection("characters").doc(id).delete()
      .catch(e => console.warn("Synchronisation (suppression) échouée :", e));
  };
  firestoreSaveCampaignRemote = function (campaign) {
    if (!fbDb) return;
    groupCollection("campaign").doc("main").set(stripUndefined(campaign))
      .catch(e => console.warn("Synchronisation (campagne) échouée :", e));
  };
  firestoreSaveMessage = function (message) {
    if (!fbDb) return;
    groupCollection("messages").doc(message.id).set(stripUndefined(message))
      .catch(e => console.warn("Synchronisation (message) échouée :", e));
  };
  firestoreDeleteMessageRemote = function (id) {
    if (!fbDb) return;
    groupCollection("messages").doc(id).delete()
      .catch(e => console.warn("Synchronisation (suppression message) échouée :", e));
  };

  // ---------- Réconciliation initiale (ne jamais écraser sans fusionner) ----------
  reconcileCharactersOnConnect();
  reconcileCampaignOnConnect();
  reconcileMessagesOnConnect();
}

function reconcileCharactersOnConnect() {
  groupCollection("characters").get().then(snapshot => {
    const remoteChars = snapshot.docs.map(d => d.data());
    const localChars = loadCharacters();
    const merged = mergeCharacterLists(localChars, remoteChars).map(migrateCharacter);
    saveCharacters(merged);

    // Renvoie vers Firestore tout ce qui est absent ou plus récent localement
    merged.forEach(c => {
      const remoteMatch = remoteChars.find(rc => rc.id === c.id);
      if (!remoteMatch || new Date(remoteMatch.updatedAt || 0) < new Date(c.updatedAt || 0)) {
        firestoreSaveCharacter(c);
      }
    });

    notifyRemoteDataChanged();
    attachCharactersListener();
  }).catch(e => {
    console.warn("Lecture initiale Firestore (personnages) échouée :", e);
    attachCharactersListener();
  });
}

function attachCharactersListener() {
  groupCollection("characters").onSnapshot(snapshot => {
    const chars = snapshot.docs.map(d => d.data()).map(migrateCharacter);
    saveCharacters(chars);
    notifyRemoteDataChanged();
  }, err => console.warn("Écoute Firestore (personnages) interrompue :", err));
}

function reconcileCampaignOnConnect() {
  groupCollection("campaign").doc("main").get().then(doc => {
    const remote = doc.exists ? doc.data() : null;
    const local = loadCampaign();
    if (!remote || new Date(local.updatedAt || 0) > new Date(remote.updatedAt || 0)) {
      firestoreSaveCampaignRemote(local);
    } else {
      localStorage.setItem(storageKey("wg_campaign_v1"), JSON.stringify(Object.assign(createBlankCampaign(), remote)));
    }
    notifyRemoteDataChanged();
    attachCampaignListener();
  }).catch(e => {
    console.warn("Lecture initiale Firestore (campagne) échouée :", e);
    attachCampaignListener();
  });
}

function attachCampaignListener() {
  groupCollection("campaign").doc("main").onSnapshot(doc => {
    if (doc.exists) {
      localStorage.setItem(storageKey("wg_campaign_v1"), JSON.stringify(Object.assign(createBlankCampaign(), doc.data())));
      notifyRemoteDataChanged();
    }
  }, err => console.warn("Écoute Firestore (campagne) interrompue :", err));
}

function reconcileMessagesOnConnect() {
  groupCollection("messages").get().then(snapshot => {
    const remoteMsgs = snapshot.docs.map(d => d.data());
    const localMsgs = loadMessages();
    const merged = mergeMessageLists(localMsgs, remoteMsgs);
    saveMessagesLocal(merged);

    // Renvoie vers Firestore les messages locaux absents du serveur
    merged.forEach(m => {
      if (!remoteMsgs.some(rm => rm.id === m.id)) firestoreSaveMessage(m);
    });

    notifyRemoteDataChanged();
    attachMessagesListener();
  }).catch(e => {
    console.warn("Lecture initiale Firestore (messages) échouée :", e);
    attachMessagesListener();
  });
}

function attachMessagesListener() {
  groupCollection("messages").onSnapshot(snapshot => {
    const msgs = snapshot.docs.map(d => d.data());
    saveMessagesLocal(msgs);
    notifyRemoteDataChanged();
  }, err => console.warn("Écoute Firestore (messages) interrompue :", err));
}

function notifyRemoteDataChanged() {
  if (typeof onRemoteDataChanged === "function") onRemoteDataChanged();
}

function updateSyncStatusBadge() {
  const el = document.getElementById("sync-status");
  if (!el) return;
  const groupName = getGroupDisplayName();
  if (firebaseSyncStatus === "connected") {
    el.textContent = `🔥 Groupe "${groupName}" — synchronisé en temps réel`;
    el.className = "sync-status sync-ok";
  } else {
    el.textContent = groupName ? `○ Groupe "${groupName}" — mode local uniquement` : "○ Mode local uniquement";
    el.className = "sync-status sync-off";
  }
}


// ==== js/combat-calc.js ====
// ============================================================
// CALCULATRICE DE COMBAT — jets de dés selon les règles officielles.
// Résultat d'un d6 : 1-3 = rien, 4-5 = 1 Icône, 6 = Icône Exalté (2 Icônes).
// Brutal (ED) : 1-2=0, 3-4=1, 5-6=2. Fusion/Melta (ED, courte portée) : idem Brutal.
// Le premier dé de la réserve d'attaque est le Dé de Courroux (Wrath Die).
// ============================================================

let calcState = {
  attackerId: "",
  weaponRef: "",       // "melee|idx" ou "ranged|idx" du personnage attaquant
  targetId: "",
  attackPool: 6,
  weaponName: "",
  weaponDamage: 10,
  weaponED: 2,
  weaponAP: 0,
  brutal: false,
  melta: false,
  targetDefence: 4,
  targetResilience: 5,
  lastHitRoll: null,
  lastDamageRoll: null,
  history: []
};

function rollDice(n) {
  const rolls = [];
  for (let i = 0; i < n; i++) rolls.push(1 + Math.floor(Math.random() * 6));
  return rolls;
}

function iconsForRoll(die, specialEd) {
  if (specialEd) {
    if (die <= 2) return 0;
    if (die <= 4) return 1;
    return 2;
  }
  if (die <= 3) return 0;
  if (die === 4 || die === 5) return 1;
  return 2; // 6 = Icône Exalté
}

function sumIcons(rolls, specialEd) {
  return rolls.reduce((sum, d) => sum + iconsForRoll(d, specialEd), 0);
}

function renderDiceRow(rolls, specialEd, markWrathDie) {
  return rolls.map((d, i) => {
    const icons = iconsForRoll(d, specialEd);
    let cls = icons === 0 ? "die die-blank" : icons === 1 ? "die die-icon" : "die die-exalted";
    if (markWrathDie && i === 0) cls += " die-wrath";
    return `<span class="${cls}" style="animation-delay:${i * 60}ms">${d}</span>`;
  }).join("");
}

function renderCalcTab() {
  const container = document.getElementById("calc-content");
  const characters = loadCharacters();

  const attacker = characters.find(c => c.id === calcState.attackerId);
  const target = characters.find(c => c.id === calcState.targetId);

  const weaponOptions = attacker
    ? [{ value: "", label: "— Arme manuelle —" }]
        .concat((attacker.weapons || []).map((w, i) => ({ value: i + "|" + w.type, label: w.name })))
    : [];

  container.innerHTML = `
    <div class="panel">
      <h2 class="section-title">Calculatrice de Dégâts</h2>
      <p class="note">Icônes : 4-5 = 1, 6 = Icône Exalté (2). Lecture spéciale pour Brutal/Fusion. Le premier dé de la réserve d'attaque est votre <strong class="wrath-label">Dé de Courroux</strong>.</p>

      <div class="calc-grid">
        <div class="calc-col">
          <h3 class="codex-subhead">ATTAQUANT</h3>
          <div class="field">
            <label>Personnage</label>
            <select id="calc-attacker">
              <option value="">— Manuel —</option>
              ${characters.map(c => `<option value="${c.id}" ${calcState.attackerId === c.id ? "selected" : ""}>${escapeHtml(c.name)}</option>`).join("")}
            </select>
          </div>
          ${attacker ? `
          <div class="field">
            <label>Arme équipée</label>
            <select id="calc-weapon-ref">
              ${weaponOptions.map(o => `<option value="${o.value}" ${calcState.weaponRef === o.value ? "selected" : ""}>${escapeHtml(o.label)}</option>`).join("")}
            </select>
          </div>` : ""}
          <div class="field"><label>Réserve de dés (Compétence + Attribut)</label><input type="number" id="calc-pool" min="1" value="${calcState.attackPool}"></div>
          <div class="field"><label>Dégâts de l'arme</label><input type="number" id="calc-damage" value="${calcState.weaponDamage}"></div>
          <div class="field"><label>DE (Dés de Dégâts Supplémentaires)</label><input type="number" id="calc-ed" min="0" value="${calcState.weaponED}"></div>
          <div class="field"><label>PA (Pénétration d'Armure)</label><input type="number" id="calc-ap" value="${calcState.weaponAP}"></div>
          <div class="field-row">
            <label class="check-label"><input type="checkbox" id="calc-brutal" ${calcState.brutal ? "checked" : ""}> Trait Brutal</label>
            <label class="check-label"><input type="checkbox" id="calc-melta" ${calcState.melta ? "checked" : ""}> Trait Fusion (courte portée)</label>
          </div>
        </div>
        <div class="calc-col">
          <h3 class="codex-subhead">CIBLE</h3>
          <div class="field">
            <label>Personnage</label>
            <select id="calc-target">
              <option value="">— Manuel —</option>
              ${characters.map(c => `<option value="${c.id}" ${calcState.targetId === c.id ? "selected" : ""}>${escapeHtml(c.name)}</option>`).join("")}
            </select>
          </div>
          <div class="field"><label>Défense de la cible</label><input type="number" id="calc-defence" min="0" value="${calcState.targetDefence}"></div>
          <div class="field"><label>Résistance de la cible</label><input type="number" id="calc-resilience" min="0" value="${calcState.targetResilience}"></div>
          ${target ? `<div class="note">Blessures actuelles : ${target.wounds || 0} / ${computeDerived(target).blessuresMax}</div>` : ""}
        </div>
      </div>

      <div class="btn-row">
        <button class="btn btn-primary" id="calc-roll-attack" type="button">🎲 Lancer l'Attaque</button>
        <button class="btn" id="calc-roll-damage" type="button" ${calcState.lastHitRoll && calcState.lastHitRoll.hit ? "" : "disabled"}>🎲 Lancer les Dégâts</button>
        ${(calcState.lastDamageRoll && target) ? `<button class="btn" id="calc-apply-wounds" type="button">Appliquer ${calcState.lastDamageRoll.wounds} Blessures à ${escapeHtml(target.name)}</button>` : ""}
        <button class="btn" id="calc-reset" type="button">Réinitialiser</button>
      </div>

      <div id="calc-results"></div>

      ${calcState.history.length ? `
      <div class="calc-history">
        <h3 class="codex-subhead">HISTORIQUE DE LA SESSION</h3>
        ${calcState.history.map(h => `<div class="calc-history-row">${h}</div>`).join("")}
        <button class="btn" id="calc-clear-history" type="button">Vider l'historique</button>
      </div>` : ""}
    </div>
  `;

  document.getElementById("calc-attacker").addEventListener("change", (e) => {
    calcState.attackerId = e.target.value;
    calcState.weaponRef = "";
    const a = characters.find(c => c.id === calcState.attackerId);
    if (a) calcState.attackPool = skillTotal(a, "Capacité de Combat"); // valeur par défaut, ajustable
    renderCalcTab();
  });
  if (attacker) {
    document.getElementById("calc-weapon-ref").addEventListener("change", (e) => {
      calcState.weaponRef = e.target.value;
      applyWeaponRef(attacker);
      renderCalcTab();
    });
  }
  document.getElementById("calc-target").addEventListener("change", (e) => {
    calcState.targetId = e.target.value;
    const t = characters.find(c => c.id === calcState.targetId);
    if (t) {
      const d = computeDerived(t);
      calcState.targetDefence = d.defense;
      calcState.targetResilience = d.resistanceTotal;
    }
    renderCalcTab();
  });

  document.getElementById("calc-pool").addEventListener("input", e => calcState.attackPool = parseInt(e.target.value, 10) || 1);
  document.getElementById("calc-damage").addEventListener("input", e => calcState.weaponDamage = parseInt(e.target.value, 10) || 0);
  document.getElementById("calc-ed").addEventListener("input", e => calcState.weaponED = parseInt(e.target.value, 10) || 0);
  document.getElementById("calc-ap").addEventListener("input", e => calcState.weaponAP = parseInt(e.target.value, 10) || 0);
  document.getElementById("calc-brutal").addEventListener("change", e => calcState.brutal = e.target.checked);
  document.getElementById("calc-melta").addEventListener("change", e => calcState.melta = e.target.checked);
  document.getElementById("calc-defence").addEventListener("input", e => calcState.targetDefence = parseInt(e.target.value, 10) || 0);
  document.getElementById("calc-resilience").addEventListener("input", e => calcState.targetResilience = parseInt(e.target.value, 10) || 0);

  document.getElementById("calc-roll-attack").addEventListener("click", doRollAttack);
  document.getElementById("calc-roll-damage").addEventListener("click", doRollDamage);
  document.getElementById("calc-reset").addEventListener("click", () => {
    calcState.lastHitRoll = null;
    calcState.lastDamageRoll = null;
    renderCalcTab();
  });
  const applyBtn = document.getElementById("calc-apply-wounds");
  if (applyBtn) applyBtn.addEventListener("click", () => {
    const t = getCharacter(calcState.targetId);
    if (!t) return;
    t.wounds = (t.wounds || 0) + calcState.lastDamageRoll.wounds;
    upsertCharacter(t);
    toast(`${calcState.lastDamageRoll.wounds} Blessures appliquées à ${t.name}.`, "success");
    renderCalcTab();
  });
  const clearBtn = document.getElementById("calc-clear-history");
  if (clearBtn) clearBtn.addEventListener("click", () => { calcState.history = []; renderCalcTab(); });

  renderCalcResults();
}

function applyWeaponRef(attacker) {
  if (!calcState.weaponRef) return;
  const [idxStr, type] = calcState.weaponRef.split("|");
  const w = attacker.weapons[parseInt(idxStr, 10)];
  if (!w) return;
  calcState.weaponName = w.name;
  calcState.weaponDamage = resolveWeaponDamage(attacker, w);
  calcState.weaponED = parseInt(w.ed, 10) || 0;
  calcState.weaponAP = parseInt(String(w.ap).replace(/[^0-9-]/g, ""), 10) || 0;
  calcState.brutal = /brutal/i.test(w.traits || "");
  calcState.melta = /(melta|fusion)/i.test(w.traits || "");
  calcState.attackPool = type === "ranged" ? skillTotal(attacker, "Capacité de Tir") : skillTotal(attacker, "Capacité de Combat");
}

function doRollAttack() {
  const rolls = rollDice(calcState.attackPool);
  const icons = sumIcons(rolls, false);
  const hit = icons >= calcState.targetDefence;
  const wrathExalted = rolls[0] === 6;
  calcState.lastHitRoll = { rolls, icons, hit, wrathExalted };
  calcState.lastDamageRoll = null;
  const atkName = attackerLabel();
  const tgtName = targetLabel();
  calcState.history.unshift(`${atkName} attaque ${tgtName} : ${icons} Icônes vs Déf. ${calcState.targetDefence} → ${hit ? "TOUCHÉ" : "MANQUÉ"}${wrathExalted ? " ⚡ Dé de Courroux Exalté !" : ""}`);
  renderCalcTab();
}

function doRollDamage() {
  const specialEd = calcState.brutal || calcState.melta;
  const rolls = rollDice(calcState.weaponED);
  const bonus = sumIcons(rolls, specialEd);
  const totalDamage = calcState.weaponDamage + bonus;
  const effectiveResilience = Math.max(0, calcState.targetResilience - calcState.weaponAP);
  const wounds = Math.max(0, totalDamage - effectiveResilience);
  calcState.lastDamageRoll = { rolls, bonus, totalDamage, effectiveResilience, wounds, specialEd };
  calcState.history.unshift(`→ Dégâts : ${totalDamage} − Résistance ${effectiveResilience} = ${wounds} Blessures`);
  renderCalcTab();
}

function attackerLabel() {
  const a = loadCharacters().find(c => c.id === calcState.attackerId);
  return a ? a.name : "Attaquant";
}
function targetLabel() {
  const t = loadCharacters().find(c => c.id === calcState.targetId);
  return t ? t.name : "la cible";
}

function renderCalcResults() {
  const el = document.getElementById("calc-results");
  if (!el) return;
  let html = "";

  if (calcState.lastHitRoll) {
    const r = calcState.lastHitRoll;
    html += `<div class="calc-result-block">
      <h3 class="codex-subhead">JET D'ATTAQUE</h3>
      <div class="dice-row">${renderDiceRow(r.rolls, false, true)}</div>
      <div class="calc-summary">Icônes : <strong>${r.icons}</strong> vs Défense <strong>${calcState.targetDefence}</strong> → <span class="${r.hit ? "calc-hit" : "calc-miss"}">${r.hit ? "TOUCHÉ" : "MANQUÉ"}</span></div>
      ${r.wrathExalted ? `<div class="calc-summary wrath-label">⚡ Dé de Courroux Exalté — de la Gloire peut être générée !</div>` : ""}
    </div>`;
  }

  if (calcState.lastDamageRoll) {
    const r = calcState.lastDamageRoll;
    html += `<div class="calc-result-block">
      <h3 class="codex-subhead">JET DE DÉGÂTS ${r.specialEd ? "(lecture Brutal/Fusion)" : ""}</h3>
      <div class="dice-row">${renderDiceRow(r.rolls, r.specialEd, false)}</div>
      <div class="calc-summary">Dégâts de base ${calcState.weaponDamage} + ${r.bonus} (DE) = <strong>${r.totalDamage}</strong> dégâts totaux</div>
      <div class="calc-summary">Résistance ${calcState.targetResilience} − PA ${calcState.weaponAP} = <strong>${r.effectiveResilience}</strong> Résistance effective</div>
      <div class="calc-summary calc-wounds">Blessures infligées : <strong>${r.wounds}</strong></div>
    </div>`;
  }

  el.innerHTML = html;
}

// ==== js/pdfexport/pdf-export.js ====
// ============================================================
// EXPORT PDF — remplit la fiche officielle "fillable" avec pdf-lib.
// Le PDF vierge (wg_sheet_template.pdf) est un fichier séparé, chargé
// via fetch() au moment de l'export (doit être dans le même dossier
// que index.html — évite d'alourdir le site avec un gros fichier
// encodé en base64 en permanence).
// ============================================================

function setText(form, fieldId, value) {
  if (!fieldId || value == null || value === "") return;
  try {
    form.getTextField(fieldId).setText(String(value));
  } catch (e) {
    console.warn("Champ PDF introuvable :", fieldId, e.message);
  }
}

function setCheck(form, fieldId, checked) {
  if (!fieldId) return;
  try {
    const cb = form.getCheckBox(fieldId);
    if (checked) cb.check(); else cb.uncheck();
  } catch (e) {
    console.warn("Case PDF introuvable :", fieldId, e.message);
  }
}

async function exportCharacterToPdf(c) {
  if (typeof PDFLib === "undefined") {
    alert("La bibliothèque pdf-lib n'a pas pu être chargée. Une connexion internet est nécessaire pour cette fonctionnalité (elle est chargée depuis un CDN).");
    return;
  }
  const btn = document.getElementById("export-pdf-btn");
  const originalText = btn ? btn.textContent : "";
  if (btn) { btn.textContent = "Génération du PDF..."; btn.disabled = true; }

  try {
    const { PDFDocument } = PDFLib;
    const templateResponse = await fetch("wg_sheet_template.pdf");
    if (!templateResponse.ok) throw new Error("Fichier modèle introuvable (wg_sheet_template.pdf doit être dans le même dossier que index.html).");
    const templateBytes = await templateResponse.arrayBuffer();
    const pdfDoc = await PDFDocument.load(templateBytes);
    const form = pdfDoc.getForm();
    const d = computeDerived(c);
    const species = getSpecies(c.species);

    // En-tête
    setText(form, PDF_FIELDS.playerName, c.playerName);
    setText(form, PDF_FIELDS.characterName, c.name);
    setText(form, PDF_FIELDS.tier, c.tier);
    setText(form, PDF_FIELDS.species, c.species);
    setText(form, PDF_FIELDS.archetype, c.archetype);
    setText(form, PDF_FIELDS.background, c.historique);
    setText(form, PDF_FIELDS.rank, c.rang);
    setText(form, PDF_FIELDS.faction, c.faction);
    setText(form, PDF_FIELDS.keywords, c.motsCles);
    setText(form, PDF_FIELDS.wrathTracker, c.fureur ? String(c.fureur) : "");

    // Attributs
    ATTRIBUTES.filter(a => a.key !== "Spd").forEach(a => {
      const f = PDF_FIELDS.attr[a.key];
      const score = (c.attributes && c.attributes[a.key]) || 1;
      const bonus = (species.attrBonus && species.attrBonus[a.key]) || 0;
      setText(form, f.rating, score);
      setText(form, f.bonus, bonus || "");
      setText(form, f.total, score + bonus);
    });

    // Compétences
    SKILLS.forEach(s => {
      const f = PDF_FIELDS.skills[s.name];
      if (!f) return;
      const rank = (c.skills && c.skills[s.name]) || 0;
      setText(form, f.rating, rank);
      setText(form, f.total, skillTotal(c, s.name));
    });

    // Objective / Survival
    setText(form, PDF_FIELDS.conviction, d.conviction);
    setText(form, PDF_FIELDS.resolve, d.resolution);
    setText(form, PDF_FIELDS.size, d.taille);
    setText(form, PDF_FIELDS.speed, d.vitesse);
    setText(form, PDF_FIELDS.defence, d.defense);
    setText(form, PDF_FIELDS.resilienceBase, d.resistanceBase);
    setText(form, PDF_FIELDS.resilienceArmour, d.resistanceArmour);
    setText(form, PDF_FIELDS.resilienceTotal, d.resistanceTotal);
    setText(form, PDF_FIELDS.woundsCurrent, c.wounds || 0);
    setText(form, PDF_FIELDS.woundsMax, d.blessuresMax);
    setText(form, PDF_FIELDS.shockCurrent, c.shock || 0);
    setText(form, PDF_FIELDS.shockMax, d.stressMax);
    setText(form, PDF_FIELDS.determination, d.determination);

    // Armes (jusqu'à 5)
    (c.weapons || []).slice(0, 5).forEach((w, i) => {
      const f = PDF_FIELDS.weapons[i];
      const dicePool = w.type === "ranged" ? skillTotal(c, "Capacité de Tir")
        : w.type === "melee" ? skillTotal(c, "Capacité de Combat") : "";
      setText(form, f.name, w.name);
      setText(form, f.dicePool, dicePool);
      setText(form, f.damage, w.dmg);
      setText(form, f.ed, w.ed);
      setText(form, f.ap, w.ap);
      setText(form, f.salvo, w.salvo != null ? w.salvo : "");
      if (w.type === "ranged") {
        setText(form, f.short, w.short); setText(form, f.med, w.med); setText(form, f.long, w.long);
      } else {
        setText(form, f.med, w.range);
      }
      setText(form, f.traits, w.traits);
    });

    // Armure (jusqu'à 3)
    (c.armours || []).slice(0, 3).forEach((a, i) => {
      const f = PDF_FIELDS.armours[i];
      setText(form, f.name, a.name);
      setText(form, f.ar, a.ar);
      setText(form, f.traits, a.traits);
    });

    // Gear (equipement general, jusqu'a 8 cases en 2 colonnes)
    (c.equipment || []).slice(0, 8).forEach((g, i) => setText(form, PDF_FIELDS.gear[i], g));

    setText(form, PDF_FIELDS.influence, d.influence);
    setText(form, PDF_FIELDS.wealth, d.richesse);

    // Talents (jusqu'à 18 : 9 lignes x 2 colonnes)
    (c.talents || []).forEach((name, i) => {
      const row = Math.floor(i / 2), col = i % 2;
      if (row < PDF_FIELDS.talents.length) setText(form, PDF_FIELDS.talents[row][col], name);
    });
    setText(form, PDF_FIELDS.faithCurrent, c.foiCurrent || "");
    setText(form, PDF_FIELDS.faithMax, c.foiMax || "");

    // Blessures / Corruption
    setText(form, PDF_FIELDS.traumaticMax, c.tier + 1);
    (c.blessuresGraves || []).slice(0, 6).forEach((v, i) => setText(form, PDF_FIELDS.traumaticInjuries[i], v));
    const memorable = (c.blessuresGuerre || "").split("\n").filter(Boolean);
    memorable.slice(0, 9).forEach((v, i) => setText(form, PDF_FIELDS.memorableInjuries[i], v));
    const mutList = (c.mutations || "").split("\n").filter(Boolean);
    mutList.slice(0, 9).forEach((v, i) => setText(form, PDF_FIELDS.mutations[i], v));

    const corruption = c.corruption || 0;
    let remaining = corruption;
    PDF_FIELDS.corruptionGrid.forEach((row, rIdx) => {
      row.forEach(fieldId => {
        setCheck(form, fieldId, remaining > 0);
        if (remaining > 0) remaining--;
      });
    });
    const level = Math.min(5, Math.ceil(corruption / 5));
    PDF_FIELDS.corruptionLevel.forEach((fieldId, i) => setCheck(form, fieldId, i < level));

    // Pouvoirs Psychiques (jusqu'à 11)
    (c.psychicPowers || []).slice(0, 11).forEach((p, i) => {
      const f = PDF_FIELDS.psychicPowers[i];
      setText(form, f.name, p.name);
      setText(form, f.dn, p.sd);
      setText(form, f.activation, p.activation);
      setText(form, f.duration, p.duree);
      setText(form, f.range, p.portee);
      setText(form, f.target, p.cible);
      setText(form, f.effect, p.effet);
    });

    // Notes / Stealth / Passive Awareness / XP
    setText(form, PDF_FIELDS.notes, c.notes);
    setText(form, PDF_FIELDS.stealth, skillTotal(c, "Furtivité"));
    setText(form, PDF_FIELDS.passiveAwareness, d.vigilancePassive);
    setText(form, PDF_FIELDS.xpEarned, c.xpTotal || 0);
    setText(form, PDF_FIELDS.xpCurrent, (c.xpTotal || 0) - computeXpSpent(c));

    try { form.updateFieldAppearances(); } catch (e) { /* ignore, best effort */ }

    const pdfBytes = await pdfDoc.save();
    const blob = new Blob([pdfBytes], { type: "application/pdf" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = (c.name || "personnage").replace(/[^a-z0-9]+/gi, "_") + "_WrathGlory.pdf";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  } catch (e) {
    console.error(e);
    alert("Erreur lors de la génération du PDF : " + e.message);
  } finally {
    if (btn) { btn.textContent = originalText; btn.disabled = false; }
  }
}

let state = {
  view: "list",       // "list" | "sheet" | "codex" | "print"
  characterId: null,
  codexTab: "attributs"
};

function switchTab(view) {
  state.view = view;
  document.querySelectorAll(".tab-btn").forEach(b => b.classList.toggle("active", b.dataset.view === view));
  document.querySelectorAll(".view").forEach(v => v.classList.toggle("active", v.id === "view-" + view));
  if (view === "tutoriel") renderTutorielTab();
  if (view === "list") { renderCharacterList(); renderSharePanel(); }
  if (view === "messagerie") renderMessagerieTab();
  if (view === "codex") renderCodex();
  if (view === "calc") renderCalcTab();
  if (view === "calendrier") renderCalendrierTab();
  if (view === "lore") renderLoreTab();
  if (view === "admin") renderAdminTab();
  renderCampaignBanner();
}

// ---------- Vue : Messagerie ----------

function renderMessagerieTab() {
  const container = document.getElementById("messagerie-content");
  const characters = loadCharacters();

  if (characters.length === 0) {
    container.innerHTML = `<div class="panel"><p class="note">Créez au moins un personnage pour utiliser la Messagerie.</p></div>`;
    return;
  }

  if (!state.msgIdentity || (state.msgIdentity !== "MJ" && !characters.find(c => c.id === state.msgIdentity))) {
    state.msgIdentity = characters[0].id;
  }

  const identityOptions = characters.map(c =>
    `<option value="${c.id}" ${state.msgIdentity === c.id ? "selected" : ""}>${escapeHtml(c.name)}${c.ownerLabel ? " (" + escapeHtml(c.ownerLabel) + ")" : ""}${c.passwordHash ? " 🔒" : ""}</option>`
  ).join("") + (adminUnlocked ? `<option value="MJ" ${state.msgIdentity === "MJ" ? "selected" : ""}>Maître de Jeu</option>` : "");

  let channels;
  if (state.msgIdentity === "MJ") {
    channels = characters.map(c => ({ id: gmChannelId(c.id), label: c.name }));
  } else {
    channels = [{ id: gmChannelId(state.msgIdentity), label: "Maître de Jeu" }]
      .concat(characters.filter(c => c.id !== state.msgIdentity).map(c => ({ id: dmChannelId(state.msgIdentity, c.id), label: c.name })));
  }

  if (!state.msgChannel || !channels.find(ch => ch.id === state.msgChannel)) {
    state.msgChannel = channels[0].id;
  }

  const allMsgs = loadMessages();
  const unreadByChannel = {}; // simple compte de messages par canal, pour affichage
  channels.forEach(ch => { unreadByChannel[ch.id] = allMsgs.filter(m => m.channelId === ch.id).length; });

  container.innerHTML = `
    <div class="panel">
      <h2 class="section-title">Messagerie</h2>
      <p class="note">Échanges en temps réel — RP passif entre les sessions, questions au MJ, ou discussions entre personnages.</p>
      <div class="field" style="max-width:320px;">
        <label>Vous parlez en tant que</label>
        <select id="msg-identity-select">${identityOptions}</select>
      </div>
    </div>

    <div class="panel">
      <div class="channel-tabs">
        ${channels.map(ch => `
          <button class="channel-tab ${ch.id === state.msgChannel ? "active" : ""}" data-channel="${ch.id}" type="button">
            💬 ${escapeHtml(ch.label)}${unreadByChannel[ch.id] ? ` <span class="channel-count">${unreadByChannel[ch.id]}</span>` : ""}
          </button>
        `).join("")}
      </div>

      <div id="thread-box" class="thread-box">${renderThread(state.msgChannel, state.msgIdentity)}</div>

      <div class="field-row" style="align-items:flex-end;margin-top:0.8rem;">
        <div class="field" style="flex:1;">
          <textarea id="msg-compose" rows="2" placeholder="Écrire un message..."></textarea>
        </div>
        <button class="btn btn-primary" id="msg-send-btn" type="button">Envoyer</button>
      </div>
    </div>
  `;

  document.getElementById("msg-identity-select").addEventListener("change", async (e) => {
    const newIdentity = e.target.value;
    if (newIdentity !== "MJ" && newIdentity !== state.msgIdentity) {
      const c = characters.find(x => x.id === newIdentity);
      if (c && c.passwordHash && !sessionUnlocked.has(c.id)) {
        const pw = prompt(`Mot de passe de "${c.name}" pour parler en son nom :`);
        if (pw == null) { renderMessagerieTab(); return; }
        const ok = await tryUnlockCharacter(c, pw);
        if (!ok) {
          toast("Mot de passe incorrect — vous ne pouvez pas parler au nom de ce personnage.", "error");
          renderMessagerieTab();
          return;
        }
        toast(`Identité "${c.name}" déverrouillée pour cette session.`, "success");
      }
    }
    state.msgIdentity = newIdentity;
    state.msgChannel = null;
    renderMessagerieTab();
  });
  container.querySelectorAll(".channel-tab").forEach(btn => {
    btn.addEventListener("click", () => {
      state.msgChannel = btn.dataset.channel;
      renderMessagerieTab();
    });
  });
  document.getElementById("msg-send-btn").addEventListener("click", sendMessageFromComposer);
  document.getElementById("msg-compose").addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessageFromComposer(); }
  });
  document.getElementById("thread-box").addEventListener("click", (e) => {
    const btn = e.target.closest("[data-delete-msg]");
    if (!btn) return;
    if (!confirm("Supprimer ce message ?")) return;
    deleteMessage(btn.dataset.deleteMsg);
    document.getElementById("thread-box").innerHTML = renderThread(state.msgChannel, state.msgIdentity);
  });

  // Défile jusqu'au dernier message
  const box = document.getElementById("thread-box");
  if (box) box.scrollTop = box.scrollHeight;
}

function sendMessageFromComposer() {
  const textEl = document.getElementById("msg-compose");
  const text = textEl.value.trim();
  if (!text) return;
  const characters = loadCharacters();
  let authorName;
  if (state.msgIdentity === "MJ") {
    authorName = "Maître de Jeu";
  } else {
    const c = characters.find(x => x.id === state.msgIdentity);
    authorName = c ? c.name : "?";
  }
  sendMessage(state.msgChannel, state.msgIdentity, authorName, text);
  textEl.value = "";
  document.getElementById("thread-box").innerHTML = renderThread(state.msgChannel, state.msgIdentity);
  const box = document.getElementById("thread-box");
  box.scrollTop = box.scrollHeight;
  // Rafraîchit juste le compteur du canal actif sans tout redessiner (garde le focus)
  const activeTab = document.querySelector(`.channel-tab[data-channel="${state.msgChannel}"]`);
  if (activeTab) {
    const count = loadMessages().filter(m => m.channelId === state.msgChannel).length;
    activeTab.innerHTML = activeTab.innerHTML.replace(/<span class="channel-count">\d+<\/span>/, "") + ` <span class="channel-count">${count}</span>`;
  }
}

function renderThread(channelId, viewerId) {
  const msgs = messagesForChannel(channelId);
  if (msgs.length === 0) return `<p class="note">Aucun message pour l'instant. Écrivez le premier !</p>`;
  return msgs.map(m => {
    const canDelete = m.authorId === viewerId || adminUnlocked;
    return `
    <div class="message-bubble ${m.authorId === viewerId ? "message-mine" : "message-other"}">
      <div class="message-meta">
        ${escapeHtml(m.authorName)} — ${formatHistoryDate(m.ts)}
        ${canDelete ? `<button class="msg-delete-btn" data-delete-msg="${m.id}" type="button" title="Supprimer ce message">&times;</button>` : ""}
      </div>
      <div class="message-text">${escapeHtml(m.text).replace(/\n/g, "<br>")}</div>
    </div>
  `;
  }).join("");
}

// Rafraîchissement léger appelé quand des données distantes changent pendant
// que l'onglet Messagerie est ouvert : met à jour le fil et les compteurs
// sans toucher au brouillon en cours de frappe ni changer de canal.
function refreshMessagerieLive() {
  if (!document.getElementById("messagerie-content").innerHTML.trim()) return;
  const characters = loadCharacters();
  if (!state.msgIdentity || !state.msgChannel) { renderMessagerieTab(); return; }

  const box = document.getElementById("thread-box");
  if (box) {
    const wasNearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 60;
    box.innerHTML = renderThread(state.msgChannel, state.msgIdentity);
    if (wasNearBottom) box.scrollTop = box.scrollHeight;
  }
  const allMsgs = loadMessages();
  document.querySelectorAll(".channel-tab").forEach(tab => {
    const chId = tab.dataset.channel;
    const count = allMsgs.filter(m => m.channelId === chId).length;
    const label = tab.textContent.replace(/\s*\d+\s*$/, "").trim();
    tab.innerHTML = `${escapeHtml(label)}${count ? ` <span class="channel-count">${count}</span>` : ""}`;
  });
}

// ---------- Vue : Calendrier ----------

let calState = { year: new Date().getFullYear(), month: new Date().getMonth() }; // month: 0-11

function renderCalendrierTab() {
  const container = document.getElementById("calendrier-content");
  const campaign = loadCampaign();
  const sessions = campaign.sessions || [];

  const { year, month } = calState;
  const monthNames = ["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"];
  const firstDay = new Date(year, month, 1);
  const startWeekday = (firstDay.getDay() + 6) % 7; // lundi = 0
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const todayStr = new Date().toISOString().slice(0, 10);

  const sessionsByDate = {};
  sessions.forEach(s => { (sessionsByDate[s.date] = sessionsByDate[s.date] || []).push(s); });

  let cells = "";
  for (let i = 0; i < startWeekday; i++) cells += `<div class="cal-cell cal-cell-empty"></div>`;
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${year}-${String(month + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
    const daySessions = sessionsByDate[dateStr] || [];
    const isToday = dateStr === todayStr;
    cells += `
      <div class="cal-cell ${daySessions.length ? "cal-has-session" : ""} ${isToday ? "cal-today" : ""}" ${daySessions.length ? `data-cal-date="${dateStr}"` : ""}>
        <span class="cal-daynum">${d}</span>
        ${daySessions.map(s => `<span class="cal-marker">${escapeHtml(s.title)}</span>`).join("")}
      </div>`;
  }

  // Prochaine session à venir (toutes dates confondues)
  const upcoming = sessions.filter(s => s.date >= todayStr).sort((a, b) => a.date.localeCompare(b.date))[0];

  container.innerHTML = `
    <div class="panel">
      <h2 class="section-title">Calendrier des Sessions</h2>
      ${upcoming ? `<div class="campaign-announcement">📅 Prochaine session : <strong>${escapeHtml(upcoming.title)}</strong> — ${formatDateFr(upcoming.date)} à ${escapeHtml(upcoming.time || "")}</div>` : `<p class="note">Aucune session à venir programmée.</p>`}

      <div class="cal-header">
        <button class="btn" id="cal-prev" type="button">← </button>
        <h3 class="cal-month-title">${monthNames[month]} ${year}</h3>
        <button class="btn" id="cal-next" type="button">→</button>
      </div>
      <div class="cal-grid">
        ${["Lun","Mar","Mer","Jeu","Ven","Sam","Dim"].map(d => `<div class="cal-weekday">${d}</div>`).join("")}
        ${cells}
      </div>
      <p class="note" style="margin-top:0.8rem;">Cliquez une date marquée pour voir les détails. Les sessions sont créées par le MJ depuis l'onglet Admin.</p>
    </div>

    <div id="session-popup-overlay" class="session-popup-overlay" style="display:none;">
      <div class="session-popup-box">
        <button class="session-popup-close" id="session-popup-close" type="button">&times;</button>
        <div id="session-popup-content"></div>
      </div>
    </div>
  `;

  document.getElementById("cal-prev").addEventListener("click", () => {
    calState.month--; if (calState.month < 0) { calState.month = 11; calState.year--; }
    renderCalendrierTab();
  });
  document.getElementById("cal-next").addEventListener("click", () => {
    calState.month++; if (calState.month > 11) { calState.month = 0; calState.year++; }
    renderCalendrierTab();
  });
  container.querySelectorAll("[data-cal-date]").forEach(cell => {
    cell.addEventListener("click", () => openSessionPopup(sessionsByDate[cell.dataset.calDate]));
  });
  document.getElementById("session-popup-close").addEventListener("click", closeSessionPopup);
  document.getElementById("session-popup-overlay").addEventListener("click", (e) => {
    if (e.target.id === "session-popup-overlay") closeSessionPopup();
  });
}

function openSessionPopup(sessionsForDay) {
  const overlay = document.getElementById("session-popup-overlay");
  const content = document.getElementById("session-popup-content");
  content.innerHTML = sessionsForDay.map(s => `
    <div class="session-popup-entry">
      <div class="seal-icon" style="margin:0 auto 0.8rem;width:2.6rem;height:2.6rem;font-size:1.1rem;">📅</div>
      <h3 class="session-popup-title">${escapeHtml(s.title)}</h3>
      <div class="session-popup-datetime">${formatDateFr(s.date)}${s.time ? " — " + escapeHtml(s.time) : ""}</div>
      ${s.notes ? `<p class="session-popup-notes">${escapeHtml(s.notes).replace(/\n/g, "<br>")}</p>` : `<p class="note">Aucune note pour cette session.</p>`}
    </div>
  `).join("<hr style='border-color:var(--border);margin:1rem 0;'>");
  overlay.style.display = "flex";
}

function closeSessionPopup() {
  document.getElementById("session-popup-overlay").style.display = "none";
}

function formatDateFr(dateStr) {
  try {
    const d = new Date(dateStr + "T00:00:00");
    return d.toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
  } catch (e) { return dateStr; }
}

// ---------- Notifications (toast) ----------

function toast(message, kind) {
  let box = document.getElementById("toast-box");
  if (!box) {
    box = document.createElement("div");
    box.id = "toast-box";
    document.body.appendChild(box);
  }
  const el = document.createElement("div");
  el.className = "toast" + (kind ? " toast-" + kind : "");
  el.textContent = message;
  box.appendChild(el);
  requestAnimationFrame(() => el.classList.add("toast-show"));
  setTimeout(() => {
    el.classList.remove("toast-show");
    setTimeout(() => el.remove(), 300);
  }, 3200);
}

async function newCharacter() {
  const name = prompt("Nom du personnage :", "Nouveau Personnage") || "Nouveau Personnage";
  const ownerLabel = prompt("Votre nom de joueur (affiché aux autres, optionnel) :", "") || "";
  const wantsPassword = confirm("Voulez-vous protéger cette fiche par un mot de passe ?\n(Recommandé si vous partagez ce site avec d'autres joueurs : sans mot de passe, n'importe qui avec accès au navigateur peut modifier la fiche.)");
  let passwordHash = null;
  if (wantsPassword) {
    const pw = prompt("Choisissez un mot de passe pour cette fiche :");
    if (pw) passwordHash = await hashText(pw);
  }
  const c = createBlankCharacter(name);
  c.ownerLabel = ownerLabel;
  c.passwordHash = passwordHash;
  if (passwordHash) sessionUnlocked.add(c.id);
  pushHistoryEntry(c, "Création du personnage");
  upsertCharacter(c);
  openCharacterSheet(c.id);
}

function importCharacterFile(file) {
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const imported = JSON.parse(e.target.result);
      if (!imported.id || !imported.name) throw new Error("Format de fichier invalide.");
      // Nouvel id pour éviter d'écraser un personnage existant du même id
      const existing = getCharacter(imported.id);
      if (existing && !confirm(`Une fiche "${existing.name}" existe déjà localement avec cet identifiant. Remplacer ?`)) {
        imported.id = "char_" + Date.now() + "_" + Math.random().toString(36).slice(2, 8);
      }
      // Une fiche importée reste verrouillée si elle a un mot de passe :
      // l'import ne déverrouille jamais automatiquement l'édition.
      upsertCharacter(migrateCharacter(imported));
      renderCharacterList();
      toast(`Fiche "${imported.name}" importée${imported.passwordHash ? " (lecture seule)" : ""}.`, "success");
    } catch (err) {
      toast("Impossible d'importer ce fichier : " + err.message, "error");
    }
  };
  reader.readAsText(file);
}

// ---------- Panneau de Sauvegarde & Partage ----------
// Ce site n'a pas de serveur : tout passe par des fichiers JSON échangés
// entre joueurs et MJ (Discord, mail...). Ce panneau centralise les
// imports/exports au même endroit, avec glisser-déposer.

function renderSharePanel() {
  const el = document.getElementById("share-panel");
  if (!el) return;
  const chars = loadCharacters();

  el.innerHTML = `
    <h2 class="section-title">Sauvegarde &amp; Partage</h2>
    <p class="note">Aucun serveur derrière ce site : chaque navigateur a son propre stockage. Pour partager une fiche avec le MJ ou un autre joueur, exportez-la et envoyez le fichier ; pour la consulter, importez-la ci-dessous.</p>

    <div class="dropzone" id="share-dropzone">
      <div class="dropzone-icon">📂</div>
      <div>Glissez un fichier <strong>.json</strong> ici (fiche ou campagne), ou</div>
      <button class="btn" id="share-browse-btn" type="button">Choisir un fichier</button>
      <input type="file" id="share-file-input" accept=".json" style="display:none;">
    </div>

    <div class="btn-row" style="margin-top:1rem;">
      <button class="btn" id="backup-export-btn" type="button">Exporter TOUTE ma sauvegarde (${chars.length} fiche${chars.length > 1 ? "s" : ""})</button>
      <button class="btn" id="backup-import-btn" type="button">Restaurer une sauvegarde complète</button>
      <input type="file" id="backup-file-input" accept=".json" style="display:none;">
    </div>
  `;

  const dropzone = document.getElementById("share-dropzone");
  ["dragenter", "dragover"].forEach(evt => dropzone.addEventListener(evt, (e) => { e.preventDefault(); dropzone.classList.add("dropzone-active"); }));
  ["dragleave", "drop"].forEach(evt => dropzone.addEventListener(evt, (e) => { e.preventDefault(); dropzone.classList.remove("dropzone-active"); }));
  dropzone.addEventListener("drop", (e) => {
    const file = e.dataTransfer.files[0];
    if (file) handleSharedFile(file);
  });
  document.getElementById("share-browse-btn").addEventListener("click", () => document.getElementById("share-file-input").click());
  document.getElementById("share-file-input").addEventListener("change", (e) => {
    if (e.target.files[0]) handleSharedFile(e.target.files[0]);
    e.target.value = "";
  });

  document.getElementById("backup-export-btn").addEventListener("click", exportFullBackup);
  document.getElementById("backup-import-btn").addEventListener("click", () => document.getElementById("backup-file-input").click());
  document.getElementById("backup-file-input").addEventListener("change", (e) => {
    if (e.target.files[0]) importFullBackup(e.target.files[0]);
    e.target.value = "";
  });
}

// Détecte automatiquement s'il s'agit d'une fiche perso, d'une campagne,
// ou d'une sauvegarde complète, et route vers le bon import.
function handleSharedFile(file) {
  const reader = new FileReader();
  reader.onload = (e) => {
    let data;
    try { data = JSON.parse(e.target.result); }
    catch (err) { toast("Fichier JSON invalide.", "error"); return; }

    if (Array.isArray(data.characters) && data.campaign) {
      importFullBackup(file);
    } else if ("missions" in data) {
      importCampaignFile(file);
    } else if (data.id && data.name) {
      importCharacterFile(file);
    } else {
      toast("Ce fichier ne correspond à aucun format reconnu.", "error");
    }
  };
  reader.readAsText(file);
}

function exportFullBackup() {
  const bundle = {
    exportedAt: new Date().toISOString(),
    characters: loadCharacters(),
    campaign: loadCampaign()
  };
  const blob = new Blob([JSON.stringify(bundle, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "archivum_sauvegarde_" + new Date().toISOString().slice(0, 10) + ".json";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast("Sauvegarde complète exportée.", "success");
}

function importFullBackup(file) {
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const bundle = JSON.parse(e.target.result);
      if (!Array.isArray(bundle.characters)) throw new Error("Format de sauvegarde invalide.");
      if (!confirm(`Restaurer cette sauvegarde va REMPLACER les ${loadCharacters().length} fiche(s) actuelles par les ${bundle.characters.length} fiche(s) du fichier. Continuer ?`)) return;
      saveCharacters(bundle.characters.map(migrateCharacter));
      if (bundle.campaign) saveCampaign(Object.assign(createBlankCampaign(), bundle.campaign));
      renderCharacterList();
      renderSharePanel();
      renderCampaignBanner();
      toast("Sauvegarde restaurée.", "success");
    } catch (err) {
      toast("Impossible de restaurer cette sauvegarde : " + err.message, "error");
    }
  };
  reader.readAsText(file);
}

function renderCharacterSheet() {
  const c = getCharacter(state.characterId);
  if (!c) { switchTab("list"); return; }
  const derived = computeDerived(c);
  const xpSpent = computeXpSpent(c);

  const attrHtml = ATTRIBUTES.filter(a => a.key !== "Spd").map(a => `
    <div class="stat-box">
      <span class="stat-name">${a.name}<small>${a.key}</small></span>

      <span class="stat-total">Total ${attributeTotal(c, a.key)}</span>
    </div>
  `).join("");

  const skillHtml = SKILLS.map(s => {
    const rank = (c.skills && c.skills[s.name]) || 0;
    const attrTotal = attributeTotal(c, s.attr);
    const attrLabel = ATTRIBUTES.find(a => a.key === s.attr).name;
    return `
    <div class="stat-box skill-box">
      <span class="stat-name">${s.name}<small>${s.attr}</small></span>
      <input type="number" min="0" max="8" value="${rank}" data-skill="${s.name}">
      <span class="stat-calc">${rank} (Rang) + ${attrTotal} (${attrLabel}) = <strong>${skillTotal(c, s.name)}</strong></span>
    </div>
  `;
  }).join("");

  const talentsHtml = renderTalentList(c.talents);
  const weaponsHtml = renderWeaponRows(c.weapons);
  const armoursHtml = renderArmourRows(c.armours);
  const equipmentHtml = renderTagList(c.equipment, "equipment");
  const psychicHtml = renderPsychicRows(c.psychicPowers);

  const speciesOptions = SPECIES.map(s => `<option value="${s.name}" ${c.species === s.name ? "selected" : ""}>${s.name}</option>`).join("");
  const archetypeOptions = `<option value="">— Aucun —</option>` + ARCHETYPES.map(a =>
    `<option value="${a.name}" ${c.archetype === a.name ? "selected" : ""}>${a.name} (Palier ${a.tier})</option>`

    <div class="panel">

          <option value="">— Choisir un don du Codex —</option>
          ${TALENTS.map(t => `<option value="${escapeHtml(t.name)}">${escapeHtml(t.name)} (${t.xp} XP)</option>`).join("")}
        </select>
        <button class="btn" id="add-talent" type="button">Ajouter</button>
      </div>
    </div>

    <div class="panel">
      <h2 class="section-title">Armes</h2>
      <div style="overflow-x:auto;">
        <table class="codex-table sheet-equip-table" id="weapons-table">
          <thead><tr><th>Nom</th><th>Réserve</th><th>Dégâts</th><th>DS</th><th>PA</th><th>Salve</th><th>Portée</th><th>Traits</th><th></th></tr></thead>
          <tbody>${weaponsHtml}</tbody>
        </table>
      </div>
      <div class="list-tag-input">
        <select id="new-weapon-select">
          <option value="">— Ajouter une arme du Codex —</option>
          <optgroup label="Mêlée">
            ${Object.entries(MELEE_WEAPONS).flatMap(([cat, items]) => items.map((w, i) => `<option value="melee|${cat}|${i}">${escapeHtml(w.name)}</option>`)).join("")}
          </optgroup>
          <optgroup label="Distance">
            ${Object.entries(RANGED_WEAPONS).flatMap(([cat, items]) => items.map((w, i) => `<option value="ranged|${cat}|${i}">${escapeHtml(w.name)}</option>`)).join("")}
          </optgroup>
        </select>
        <button class="btn" id="add-weapon" type="button">Ajouter</button>
      </div>
      <div class="list-tag-input">
        <input type="text" id="new-weapon-custom" placeholder="...ou arme personnalisée (nom uniquement)">
        <button class="btn" id="add-weapon-custom" type="button">Ajouter</button>
      </div>
    </div>

    <div class="panel">
      <h2 class="section-title">Armure</h2>
      <div style="overflow-x:auto;">
        <table class="codex-table sheet-equip-table" id="armours-table">
          <thead><tr><th>Nom</th><th>AR</th><th>Traits</th><th></th></tr></thead>
          <tbody>${armoursHtml}</tbody>
        </table>
      </div>
      <div class="list-tag-input">
        <select id="new-armour-select">
          <option value="">— Ajouter une armure du Codex —</option>
          ${Object.entries(ARMOUR).flatMap(([cat, items]) => items.map((a, i) => `<option value="${cat}|${i}">${escapeHtml(a.name)}</option>`)).join("")}
        </select>
        <button class="btn" id="add-armour" type="button">Ajouter</button>
      </div>
    </div>

    <div class="panel">
      <h2 class="section-title">Équipement (objets divers)</h2>
      <div id="equipment-list">${equipmentHtml}</div>
